name: COTAHIST - evidencia retrospectiva 1993 FASE02 V1

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/ingestao/auditar_integridade_fonte_cotahist_1993_fase02_v1.py"
      - "dados/cotahist/raw/anual/COTAHIST_A1993.ZIP"
permissions:
  contents: write
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {lfs: true, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/ingestao/auditar_integridade_fonte_cotahist_1993_fase02_v1.py
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_1993_FASE02_INTEGRIDADE_FONTE_V1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit(cotahist): publica evidencia retrospectiva 1993 fase 02"
          git push
