name: COTAHIST 1995 - FASE 08 Semântica K4
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/ingestao/analisar_semantica_k4_cotahist_1995_v1.py"
      - "dados/cotahist/raw/anual/COTAHIST_A1995.ZIP"
      - ".github/workflows/cotahist-fase08-semantica-k4-1995-v1.yml"
permissions:
  contents: write
concurrency:
  group: cotahist-fase08-1995
  cancel-in-progress: false
jobs:
  semantica:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Executar FASE 08
        run: |
          set -euo pipefail
          python scripts/ingestao/analisar_semantica_k4_cotahist_1995_v1.py             --zip dados/cotahist/raw/anual/COTAHIST_A1995.ZIP             --output dados/cotahist/quality/COTAHIST_1995_FASE08_SEMANTICA_K4_V1.json
      - name: Persistir evidência
        run: |
          set -euo pipefail
          git config user.name "B3 Data Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_1995_FASE08_SEMANTICA_K4_V1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit(cotahist): executar fase 08 semantica k4 1995"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
