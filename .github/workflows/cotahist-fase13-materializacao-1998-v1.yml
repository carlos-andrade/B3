name: COTAHIST 1998 - FASE13 Materializacao V1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cotahist-fase13-materializacao-1998-v1.yml"
      - "scripts/ingestao/normalize_cotahist.py"
      - "scripts/ingestao/verificar_materializacao_cotahist_1998_fase13_v1.py"
      - "dados/cotahist/raw/anual/COTAHIST_A1998.ZIP"
      - "dados/cotahist/normalized/manifests/COTAHIST_A1998_quality.json"
permissions:
  contents: write
concurrency:
  group: cotahist-fase13-1998
  cancel-in-progress: false
jobs:
  materializar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0, lfs: true}
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - name: Materializar NORMALIZED
        run: python scripts/ingestao/normalize_cotahist.py --zip dados/cotahist/raw/anual/COTAHIST_A1998.ZIP --output dados/cotahist/normalized/anual/COTAHIST_A1998.csv
      - name: Verificar FASE13
        run: python scripts/ingestao/verificar_materializacao_cotahist_1998_fase13_v1.py
      - name: Publicar NORMALIZED e evidencia
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/normalized/anual/COTAHIST_A1998.csv dados/cotahist/quality/COTAHIST_1998_FASE13_MATERIALIZACAO_V1.json
          git diff --cached --quiet || git commit -m "audit(cotahist): materializar normalized 1998 fase 13"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
