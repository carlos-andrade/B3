name: Testar captura BDI
# Revalidacao de captura RAW/manifesto em 2026-10-16.

on:
  push:
    paths:
      - "ferramentas/capturar_bdi.py"
      - ".github/workflows/testar-captura-bdi.yml"
  workflow_dispatch:
    inputs:
      endpoint:
        description: "Endpoint BDI"
        required: true
        default: "DailyAverageStocks"
      date:
        description: "Data YYYY-MM-DD ou auto para procurar a última data disponível"
        required: false
        default: "auto"

permissions:
  contents: write

concurrency:
  group: bdi-capture
  cancel-in-progress: false

jobs:
  authorization_gate:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
      - name: Verificar autorização de uso do endpoint BDI
        id: gate
        run: python scripts/governanca/validar_autorizacao_endpoint.py --endpoint-id B3_BDI_TABLE_API --allow-blocked --github-output "$GITHUB_OUTPUT"

  captura:
    needs: authorization_gate
    if: needs.authorization_gate.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testar cálculo de datas
        run: python -m unittest ferramentas.test_capturar_bdi -v
      - name: Capturar
        env:
          ENDPOINT: ${{ inputs.endpoint || 'DailyAverageStocks' }}
          DATA: ${{ inputs.date || 'auto' }}
        run: |
          set -euo pipefail
          echo "DATA=$DATA" >> "$GITHUB_ENV"
          python ferramentas/capturar_bdi.py --endpoint "$ENDPOINT" --date "$DATA"
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "B3 Data Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/bdi/raw dados/bdi/manifests
          if git diff --cached --quiet; then
            echo "Nenhum novo dado."
          else
            git commit -m "data(b3): captura BDI $DATA"
            git pull --rebase origin main
            git push
          fi
      # A atualização de dados/bdi/manifests dispara o WATCHDOG por paths.
      # Não invocar outro workflow a partir deste workflow.
