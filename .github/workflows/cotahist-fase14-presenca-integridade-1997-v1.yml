name: COTAHIST - FASE14 Presenca e Integridade 1997 V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cotahist-fase14-presenca-integridade-1997-v1.yml"
      - "scripts/ingestao/validar_presenca_integridade_cotahist_1997_fase14_v1.py"
      - "dados/cotahist/raw/anual/COTAHIST_A1997.ZIP"
      - "dados/cotahist/manifests/COTAHIST_A1997.json"
      - "dados/cotahist/checksums/COTAHIST_A1997.ZIP.sha256"

permissions:
  contents: write

concurrency:
  group: cotahist-fase14-1997
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true
      - name: Executar FASE14
        run: python scripts/ingestao/validar_presenca_integridade_cotahist_1997_fase14_v1.py
      - name: Persistir evidencia FASE14
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_1997_FASE14_PRESENCA_INTEGRIDADE_V1.json
          git diff --cached --quiet || git commit -m "audit(cotahist): publicar fase 14 1997"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Resumo
        if: always()
        run: echo "FASE14 1997 concluida"
