name: COTAHIST 1993 - FASE 10 integridade independente V1
on:
  push:
    branches: [main]
    paths:
      - "dados/cotahist/raw/anual/COTAHIST_A1993.ZIP"
      - "dados/cotahist/normalized/anual/COTAHIST_A1993.csv"
      - "dados/cotahist/normalized/manifests/COTAHIST_A1993_quality.json"
      - "scripts/ingestao/validar_integridade_cotahist_1993_fase10_v1.py"
      - ".github/workflows/cotahist-fase10-integridade-1993-v1.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cotahist-fase10-integridade-1993-v1
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout com Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar FASE 10
        run: python scripts/ingestao/validar_integridade_cotahist_1993_fase10_v1.py
      - name: Publicar evidência
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cotahist-1993-fase10-integridade
          path: dados/cotahist/quality/COTAHIST_1993_FASE10_INTEGRIDADE_V1.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Commitar evidência
        if: ${{ success() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_1993_FASE10_INTEGRIDADE_V1.json
          git diff --cached --quiet || git commit -m "data(cotahist): certifica integridade independente de 1993"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
