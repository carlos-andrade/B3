name: COTAHIST 1988 - Fase 10 Integridade RAW NORMALIZED V1

on:
  push:
    paths:
      - "dados/cotahist/raw/anual/COTAHIST_A1988.ZIP"
      - "dados/cotahist/normalized/anual/COTAHIST_A1988.csv"
      - "dados/cotahist/normalized/manifests/COTAHIST_A1988_quality.json"
      - "scripts/ingestao/validar_integridade_cotahist_1988_fase10_v1.py"
      - ".github/workflows/cotahist-fase10-integridade-1988-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cotahist-1988-fase10-integridade
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout com Git LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar integridade
        run: python scripts/ingestao/validar_integridade_cotahist_1988_fase10_v1.py

      - name: Publicar evidencia
        uses: actions/upload-artifact@v4
        with:
          name: cotahist-1988-fase10-integridade
          path: dados/cotahist/quality/COTAHIST_1988_FASE10_INTEGRIDADE_V1.json
          retention-days: 30

      - name: Commitar evidencia
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_1988_FASE10_INTEGRIDADE_V1.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "quality(cotahist-1988): validar integridade fase 10"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
