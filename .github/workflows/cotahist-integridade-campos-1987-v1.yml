name: Auditoria de integridade dos campos COTAHIST 1987 v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'dados/cotahist/raw/anual/COTAHIST_A1987.ZIP'
      - 'scripts/ingestao/auditar_integridade_campos_cotahist_1987_v1.py'
      - '.github/workflows/cotahist-integridade-campos-1987-v1.yml'

permissions:
  contents: write

concurrency:
  group: cotahist-1987-integridade-campos
  cancel-in-progress: false

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Executar diagnóstico
        run: python scripts/ingestao/auditar_integridade_campos_cotahist_1987_v1.py
      - name: Commitar evidência
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_1987_AUDITORIA_INTEGRIDADE_CAMPOS_V1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: evidência integridade campos COTAHIST 1987"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
