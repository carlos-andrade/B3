# FASE12 2021: fecha o ano certificado e verifica a transicao RAW para 2022.
# A transicao nao certifica 2022; o NORMALIZED 2022 deve ser reconstruido/validado separadamente.
name: COTAHIST 2021 - FASE12 Fechamento e Transicao 2022

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cotahist-fase12-fechamento-2021-abertura-2022-v1.yml"
      - "dados/cotahist/quality/COTAHIST_2021_FASE10_VALIDACAO_INDEPENDENTE_V1.json"
      - "dados/cotahist/quality/COTAHIST_2021_FASE11_CERTIFICACAO_V1.json"
      - "dados/cotahist/raw/anual/COTAHIST_A2022.ZIP"
      - "dados/cotahist/manifests/COTAHIST_A2022.json"
      - "dados/cotahist/checksums/COTAHIST_A2022.ZIP.sha256"

permissions:
  contents: write

concurrency:
  group: cotahist-fase12-fechamento-2021-abertura-2022-v1
  cancel-in-progress: false

jobs:
  transicao:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
          sparse-checkout: |
            .gitattributes
            .github/workflows/cotahist-fase12-fechamento-2021-abertura-2022-v1.yml
            dados/cotahist/quality/COTAHIST_2021_FASE10_VALIDACAO_INDEPENDENTE_V1.json
            dados/cotahist/quality/COTAHIST_2021_FASE11_CERTIFICACAO_V1.json
            dados/cotahist/raw/anual/COTAHIST_A2022.ZIP
            dados/cotahist/manifests/COTAHIST_A2022.json
            dados/cotahist/checksums/COTAHIST_A2022.ZIP.sha256
            dados/cotahist/normalized/anual/COTAHIST_A2022.csv
            dados/cotahist/quality/COTAHIST_2021_FASE12_FECHAMENTO_2022_ABERTURA_V1.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar certificacao 2021 e transicao RAW 2022
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, sys, zipfile, datetime
          q=pathlib.Path("dados/cotahist/quality")
          f10p=q/"COTAHIST_2021_FASE10_VALIDACAO_INDEPENDENTE_V1.json"
          f11p=q/"COTAHIST_2021_FASE11_CERTIFICACAO_V1.json"
          raw=pathlib.Path("dados/cotahist/raw/anual/COTAHIST_A2022.ZIP")
          mp=pathlib.Path("dados/cotahist/manifests/COTAHIST_A2022.json")
          cp=pathlib.Path("dados/cotahist/checksums/COTAHIST_A2022.ZIP.sha256")
          csv2022=pathlib.Path("dados/cotahist/normalized/anual/COTAHIST_A2022.csv")
          ev=q/"COTAHIST_2021_FASE12_FECHAMENTO_2022_ABERTURA_V1.json"
          for p in (f10p,f11p,raw,mp,cp):
              if not p.is_file() or p.stat().st_size==0: sys.exit(f"FASE12 BLOQUEADA: arquivo ausente/vazio: {p}")
          f10=json.loads(f10p.read_text(encoding="utf-8"))
          f11=json.loads(f11p.read_text(encoding="utf-8"))
          m=json.loads(mp.read_text(encoding="utf-8"))
          blockers=[]
          if f10.get("year")!=2021 or f10.get("status")!="VALIDADO" or f10.get("mismatch_count")!=0 or f10.get("field_count")!=25:
              blockers.append("FASE10_2021_NAO_VALIDADA")
          if f11.get("year")!=2021 or f11.get("status")!="CERTIFICADO" or f11.get("decision")!="LIBERADO_PARA_FASE12":
              blockers.append("FASE11_2021_NAO_CERTIFICADA")
          raw_sha=hashlib.sha256(raw.read_bytes()).hexdigest()
          side_parts=cp.read_text(encoding="utf-8").strip().split()
          side_sha=side_parts[0] if side_parts else ""
          manifest_sha=m.get("sha256")
          if raw_sha!=manifest_sha or raw_sha!=side_sha: blockers.append("RAW_2022_HASH_DIVERGENTE")
          zip_error=None; member_count=0; bad_lengths=None; types={}
          try:
              with zipfile.ZipFile(raw) as z:
                  zip_error=z.testzip()
                  members=[n for n in z.namelist() if not n.endswith("/")]
                  member_count=len(members)
                  if member_count==1:
                      with z.open(members[0]) as f: lines=[line.rstrip(b"\r\n") for line in f]
                      bad_lengths=sum(1 for line in lines if len(line)!=245)
                      for line in lines:
                          k=line[:2].decode("ascii","replace"); types[k]=types.get(k,0)+1
          except Exception as exc: zip_error=str(exc)
          if zip_error is not None or member_count!=1 or bad_lengths!=0 or types.get("00")!=1 or types.get("99")!=1 or types.get("01",0)<=0:
              blockers.append("RAW_2022_ZIP_ESTRUTURAL_INVALIDO")
          csv_exists=csv2022.is_file() and csv2022.stat().st_size>0
          out={
            "schema_version":"1.0.0","year_closed":2021,"phase":"FASE12",
            "status":"FECHADO_COM_TRANSICAO_CONTROLADA" if not blockers else "BLOQUEADO",
            "decision":"FECHAR_2021_E_AUTORIZAR_CONTINUACAO_2022" if not blockers else "BLOQUEADO",
            "phase10_2021_status":f10.get("status"),"phase11_2021_status":f11.get("status"),
            "year2022_raw_path":str(raw),"year2022_raw_sha256":raw_sha,
            "year2022_manifest_sha256":manifest_sha,"year2022_sidecar_sha256":side_sha,
            "year2022_raw_hash_match":raw_sha==manifest_sha==side_sha,
            "year2022_zip_member_count":member_count,"year2022_invalid_record_lengths":bad_lengths,
            "year2022_record_type_counts":types,"year2022_normalized_csv_exists":csv_exists,
            "year2022_phase04_status":"AGUARDA_VALIDACAO_INDEPENDENTE" if csv_exists else "AGUARDA_RECONSTRUCAO_CSV",
            "blockers":blockers,
            "transition_scope":"Fecha 2021 após certificação; não certifica 2022. A existência de manifesto ou hash NORMALIZED declarado não prova a existência física do CSV 2022; FASE04/FASE05 devem ser verificadas e executadas no ciclo seguinte.",
            "deduplication_performed":False,
            "validated_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          ev.write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          if blockers: sys.exit("FASE12 BLOQUEADA")
          PY

      - name: Persistir fechamento e transicao
        if: always()
        run: |
          set -euo pipefail
          test -s dados/cotahist/quality/COTAHIST_2021_FASE12_FECHAMENTO_2022_ABERTURA_V1.json || { echo "Nenhuma evidência FASE12 produzida."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_2021_FASE12_FECHAMENTO_2022_ABERTURA_V1.json
          git diff --cached --quiet && exit 0
          git commit -m "audit(cotahist): fechar 2021 e registar transicao 2022"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              if git diff --name-only --diff-filter=U | grep -Fxq "dados/cotahist/quality/COTAHIST_2021_FASE12_FECHAMENTO_2022_ABERTURA_V1.json"; then
                git checkout --theirs -- "dados/cotahist/quality/COTAHIST_2021_FASE12_FECHAMENTO_2022_ABERTURA_V1.json"
                git add "dados/cotahist/quality/COTAHIST_2021_FASE12_FECHAMENTO_2022_ABERTURA_V1.json"
                GIT_EDITOR=true git rebase --continue
              else
                git rebase --abort || true
                exit 1
              fi
            fi
            if git push origin HEAD:main; then exit 0; fi
            echo "Push concorrente; nova tentativa ${attempt}/5."
            sleep $((attempt * 2))
          done
          echo "Falha de persistência após 5 tentativas."
          exit 1

      - name: Resumo operacional
        if: always()
        run: |
          {
            echo "## COTAHIST 2021 — FASE12"
            echo "- Fecha 2021 após certificação independente."
            echo "- Verifica RAW 2022; não certifica o novo ano."
            echo "- Resultado do job: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
