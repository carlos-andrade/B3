name: Diagnostico PRAZOT COTAHIST 1987 v1
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/ingestao/diagnosticar_prazot_cotahist_1987_v1.py"
      - "dados/cotahist/raw/anual/COTAHIST_A1987.ZIP"
      - ".github/workflows/cotahist-diagnostico-prazot-1987-v1.yml"
jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Executar diagnóstico
        run: python scripts/ingestao/diagnosticar_prazot_cotahist_1987_v1.py
      - name: Commitar evidência
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_1987_DIAGNOSTICO_PRAZOT_V1.json
          git diff --cached --quiet || git commit -m "evidence: diagnostico PRAZOT COTAHIST 1987"
          git push
