name: COTAHIST FASE 07F - COLISAO K4 1986
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/ingestao/investigar_colisao_k4_cotahist_1986_v1.py"
      - "dados/cotahist/raw/anual/COTAHIST_A1986.ZIP"
permissions:
  contents: write
jobs:
  investigar-k4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Investigar colisao K4
        run: |
          python scripts/ingestao/investigar_colisao_k4_cotahist_1986_v1.py             --zip dados/cotahist/raw/anual/COTAHIST_A1986.ZIP             --output dados/cotahist/quality/COTAHIST_1986_COLISAO_K4_V1.json
      - name: Commit evidencia
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_1986_COLISAO_K4_V1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(cotahist): executar fase 07F colisao K4 1986"
          git push
