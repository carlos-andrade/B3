name: COTAHIST 1999 - FASE03 Parsing Estrutural

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cotahist-fase03-parsing-1999-v1.yml"
      - "dados/cotahist/raw/anual/COTAHIST_A1999.ZIP"
      - "dados/cotahist/quality/COTAHIST_1999_FASE02_INTEGRIDADE_FONTE_V1.json"

permissions:
  contents: write

concurrency:
  group: cotahist-fase03-parsing-1999-v1
  cancel-in-progress: false

jobs:
  parsing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            .gitattributes
            .github/workflows/cotahist-fase03-parsing-1999-v1.yml
            dados/cotahist/raw/anual/COTAHIST_A1999.ZIP
            dados/cotahist/quality/COTAHIST_1999_FASE02_INTEGRIDADE_FONTE_V1.json
            dados/cotahist/quality/COTAHIST_1999_FASE03_PARSING_V1.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar pré-condições e executar parsing estrutural
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, sys, zipfile, datetime
          root = pathlib.Path(".")
          raw = root / "dados/cotahist/raw/anual/COTAHIST_A1999.ZIP"
          f2 = root / "dados/cotahist/quality/COTAHIST_1999_FASE02_INTEGRIDADE_FONTE_V1.json"
          ev = root / "dados/cotahist/quality/COTAHIST_1999_FASE03_PARSING_V1.json"
          if not raw.is_file() or not f2.is_file():
              sys.exit("FASE03 BLOQUEADA: RAW ou evidência canónica FASE02 ausente")
          e2 = json.loads(f2.read_text(encoding="utf-8"))
          if e2.get("status") != "VALIDADO" or e2.get("decision") != "LIBERADO_PARA_FASE03":
              sys.exit("FASE03 BLOQUEADA: FASE02 não VALIDADO")
          raw_sha = hashlib.sha256(raw.read_bytes()).hexdigest()
          if raw_sha != e2.get("raw_sha256"):
              sys.exit("FASE03 BLOQUEADA: SHA-256 do RAW diverge da FASE02")
          with zipfile.ZipFile(raw) as z:
              members = [name for name in z.namelist() if not name.endswith("/")]
              if len(members) != 1 or z.testzip() is not None:
                  sys.exit("FASE03 BLOQUEADA: estrutura ZIP inválida")
              member = members[0]
              with z.open(member) as f:
                  lines = [line.rstrip(b"\r\n") for line in f]
          bad_lengths = [i + 1 for i, line in enumerate(lines) if len(line) != 245]
          if bad_lengths:
              sys.exit(f"FASE03 BLOQUEADA: {len(bad_lengths)} registos não têm 245 bytes")
          types = {}
          for line in lines:
              kind = line[:2].decode("ascii", "replace")
              types[kind] = types.get(kind, 0) + 1
          if types.get("00") != 1 or types.get("99") != 1 or types.get("01", 0) <= 0:
              sys.exit(f"FASE03 BLOQUEADA: header/trailer/tipo 01 inválidos: {types}")
          dates = []
          invalid_dates = []
          for i, line in enumerate(lines, start=1):
              if line[:2] != b"01":
                  continue
              value = line[2:10].decode("ascii", "replace")
              try:
                  dates.append(datetime.datetime.strptime(value, "%Y%m%d").date().isoformat())
              except ValueError:
                  invalid_dates.append(i)
          if invalid_dates:
              sys.exit(f"FASE03 BLOQUEADA: {len(invalid_dates)} datas inválidas")
          out = {
            "schema_version": "1.0.0",
            "year": 1999,
            "phase": "FASE03",
            "status": "VALIDADO",
            "decision": "LIBERADO_PARA_FASE04",
            "evidence_kind": "PARSING_ESTRUTURAL_CANONICO_REEXECUTADO",
            "raw_path": str(raw),
            "raw_sha256": raw_sha,
            "phase02_evidence_path": str(f2),
            "phase02_status": e2.get("status"),
            "zip_member_count": len(members),
            "zip_member": member,
            "record_length_bytes": 245,
            "total_records": len(lines),
            "record_type_counts": types,
            "quote_records_type_01": types.get("01", 0),
            "invalid_record_lengths": len(bad_lengths),
            "invalid_dates": len(invalid_dates),
            "first_quote_date": min(dates) if dates else None,
            "last_quote_date": max(dates) if dates else None,
            "validated_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "parsing_statement": "Todos os registos têm 245 bytes; header 00, registos 01 e trailer 99 presentes; datas dos registos 01 válidas.",
            "limitations": ["Esta fase valida parsing estrutural; não certifica semântica de preços, identidade, calendário nem promoção do NORMALIZED."]
          }
          ev.parent.mkdir(parents=True, exist_ok=True)
          ev.write_text(json.dumps(out, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(out, ensure_ascii=False))
          PY

      - name: Persistir evidência canónica FASE03
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_1999_FASE03_PARSING_V1.json
          git diff --cached --quiet && exit 0
          git commit -m "audit(cotahist): materializar fase 03 parsing 1999"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Resumo
        if: always()
        run: |
          {
            echo "## COTAHIST 1999 — FASE03"
            echo "- Parsing estrutural do RAW, dependente de FASE02 VALIDADO."
            echo "- Não certifica semântica ou promoção de fases posteriores."
            echo "- Resultado: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
