# FASE08 2019: consistencia temporal interna, sem reordenar ou remover registos.
name: COTAHIST 2019 - FASE08 Calendario e Consistencia

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cotahist-fase08-calendario-2019-v1.yml"
      - "dados/cotahist/quality/COTAHIST_2019_FASE06_RECONCILIACAO_V1.json"
      - "dados/cotahist/quality/COTAHIST_2019_FASE07_IDENTIDADE_CHAVES_V1.json"
      - "dados/cotahist/normalized/anual/COTAHIST_A2019.csv"

permissions:
  contents: write

concurrency:
  group: cotahist-fase08-calendario-2019-v1
  cancel-in-progress: false

jobs:
  calendario:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
          sparse-checkout: |
            .gitattributes
            .github/workflows/cotahist-fase08-calendario-2019-v1.yml
            dados/cotahist/normalized/anual/COTAHIST_A2019.csv
            dados/cotahist/quality/COTAHIST_2019_FASE06_RECONCILIACAO_V1.json
            dados/cotahist/quality/COTAHIST_2019_FASE07_IDENTIDADE_CHAVES_V1.json
            dados/cotahist/quality/COTAHIST_2019_FASE08_SEMANTICA_CALENDARIO_V1.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar datas e consistencia temporal
        run: |
          python - <<'PY'
          import csv, datetime, hashlib, json, pathlib, sys
          from collections import Counter

          csv_path = pathlib.Path("dados/cotahist/normalized/anual/COTAHIST_A2019.csv")
          f6_path = pathlib.Path("dados/cotahist/quality/COTAHIST_2019_FASE06_RECONCILIACAO_V1.json")
          f7_path = pathlib.Path("dados/cotahist/quality/COTAHIST_2019_FASE07_IDENTIDADE_CHAVES_V1.json")
          ev_path = pathlib.Path("dados/cotahist/quality/COTAHIST_2019_FASE08_SEMANTICA_CALENDARIO_V1.json")
          for p in (csv_path, f6_path, f7_path):
              if not p.is_file() or p.stat().st_size == 0:
                  sys.exit(f"FASE08 BLOQUEADA: arquivo ausente/vazio: {p}")
          f6 = json.loads(f6_path.read_text(encoding="utf-8"))
          f7 = json.loads(f7_path.read_text(encoding="utf-8"))
          physical_hash = hashlib.sha256(csv_path.read_bytes()).hexdigest()
          if f6.get("year") != 2019 or f6.get("status") != "VALIDADO" or f6.get("decision") != "LIBERADO_PARA_FASE07" or f6.get("mismatch_count") != 0:
              sys.exit("FASE08 BLOQUEADA: FASE06 não VALIDADO/liberado")
          if f7.get("year") != 2019 or f7.get("status") != "VALIDADO" or f7.get("decision") != "CHAVE_CANDIDATA_COM_PRAZOT_VALIDADA_POR_CARDINALIDADE":
              sys.exit("FASE08 BLOQUEADA: FASE07 não VALIDADO")
          if f6.get("normalized_sha256") != physical_hash or f7.get("source_normalized_sha256") != physical_hash:
              sys.exit("FASE08 BLOQUEADA: hash NORMALIZED diverge das evidências FASE06/FASE07")

          with csv_path.open(encoding="utf-8", newline="") as f:
              reader = csv.DictReader(f)
              rows = list(reader)
          if len(rows) != f6.get("normalized_records") or len(rows) != f7.get("records"):
              sys.exit("FASE08 BLOQUEADA: contagem de linhas diverge das fases anteriores")

          dates, invalid = [], []
          for i, row in enumerate(rows, start=1):
              value = row.get("data_pregao", "")
              try:
                  dt = datetime.date.fromisoformat(value)
                  if dt.year != 2019:
                      invalid.append({"row": i, "date": value, "reason": "OUT_OF_YEAR"})
                  dates.append(dt)
              except ValueError:
                  invalid.append({"row": i, "date": value, "reason": "INVALID_ISO_DATE"})
          if invalid:
              sys.exit(f"FASE08 BLOQUEADA: {len(invalid)} datas inválidas/fora do ano")

          chronology = [
              {"row": i + 1, "previous_date": dates[i-1].isoformat(), "current_date": dates[i].isoformat()}
              for i in range(1, len(dates)) if dates[i] < dates[i-1]
          ]
          instrument_fields = ("codbdi", "codneg", "tpmerc", "prazot", "dismes")
          instrument_keys = [tuple(row.get(k, "") for k in instrument_fields) for row in rows]
          instrument_order_regressions = sum(1 for i in range(1, len(instrument_keys)) if instrument_keys[i] < instrument_keys[i-1])
          last_date = {}
          instrument_date_regressions = 0
          instrument_date_samples = []
          for i, row in enumerate(rows, start=1):
              key = tuple(row.get(k, "") for k in instrument_fields)
              previous = last_date.get(key)
              if previous is not None and dates[i-1] < previous:
                  instrument_date_regressions += 1
                  if len(instrument_date_samples) < 10:
                      instrument_date_samples.append({"row": i, "instrument": list(key), "previous_date": previous.isoformat(), "current_date": dates[i-1].isoformat()})
              last_date[key] = dates[i-1]

          sessions = sorted(set(dates))
          weekday_counts = Counter(d.strftime("%A") for d in sessions)
          weekend_dates = [d.isoformat() for d in sessions if d.weekday() >= 5]
          gaps = [{"from": sessions[i-1].isoformat(), "to": sessions[i].isoformat(), "calendar_days": (sessions[i]-sessions[i-1]).days}
                  for i in range(1, len(sessions)) if (sessions[i]-sessions[i-1]).days > 4]
          blockers = []
          exceptions = []
          source_order_classified = f6.get("status") == "VALIDADO" and f6.get("mismatch_count") == 0 and f6.get("normalized_sha256") == physical_hash
          if chronology:
              exceptions.append({"code": "ORDEM_DA_FONTE_NAO_CRONOLOGICA",
                                 "classification": "EXCECAO_NAO_BLOQUEADORA_COMPROVADA_POR_RECONCILIACAO_DE_LINHAS_CRITICAS" if source_order_classified else "EXCECAO_A_VALIDAR",
                                 "blocking": not source_order_classified,
                                 "detail": "A sequência física contém regressões de data. A FASE06 confirma, em ordem original, a reconciliação dos campos críticos RAW × NORMALIZED; a fase não reordena linhas. A FASE10 ainda deverá confirmar independentemente os 25 campos."})
              if not source_order_classified:
                  blockers.append("ORDEM_DA_FONTE_NAO_CLASSIFICADA")
          if instrument_date_regressions:
              exceptions.append({"code": "REGRESSAO_TEMPORAL_POR_INSTRUMENTO",
                                 "classification": "EXCECAO_DE_ORDENACAO_NAO_BLOQUEADORA_COM_RECONCILIACAO_DE_LINHAS" if source_order_classified else "EXCECAO_A_VALIDAR",
                                 "blocking": not source_order_classified,
                                 "detail": "Foram observadas datas em ordem decrescente para a mesma tupla de instrumento na sequência física. Isto é classificado como ordem de armazenamento, não como prova isolada de erro semântico; a validação independente FASE10 compara todos os campos e preserva a ordem original."})
              if not source_order_classified:
                  blockers.append("REGRESSAO_TEMPORAL_POR_INSTRUMENTO_NAO_CLASSIFICADA")
          exceptions.append({"code": "ORDEM_LEXICOGRAFICA_DOS_INSTRUMENTOS_NAO_EXIGIDA", "classification": "METRICA_INFORMATIVA_NAO_BLOQUEADORA", "blocking": False,
                             "detail": "A ordem global da tupla de instrumento não é requisito de ordenação; a consistência temporal por instrumento é avaliada separadamente."})
          exceptions.append({"code": "CALENDARIO_OFICIAL_HISTORICO_NAO_PERSISTIDO", "classification": "LIMITACAO_NAO_BLOQUEADORA_PARA_CONSISTENCIA_TEMPORAL_INTERNA", "blocking": False,
                             "detail": "Esta fase não afirma equivalência com uma lista externa oficial de feriados/sessões B3 de 2019."})
          valid = not blockers
          out = {
              "schema_version": "1.0.0", "year": 2019, "phase": "FASE08",
              "status": "VALIDADO_COM_EXCECAO" if valid else "BLOQUEADO",
              "decision": "LIBERADO_PARA_GATE_06_08" if valid else "BLOQUEADO_PARA_GATE_06_08",
              "validation_type": "CONSISTENCIA_TEMPORAL_INTERNA",
              "normalized_path": str(csv_path), "normalized_sha256": physical_hash,
              "phase06_status": f6.get("status"), "phase07_status": f7.get("status"),
              "rows_checked": len(rows), "unique_trading_dates": len(sessions),
              "first_trading_date": min(sessions).isoformat(), "last_trading_date": max(sessions).isoformat(),
              "invalid_dates": len(invalid), "out_of_year_dates": sum(1 for x in invalid if x["reason"] == "OUT_OF_YEAR"),
              "chronological_regressions": len(chronology), "chronological_regression_samples": chronology[:20],
              "instrument_order_regressions": instrument_order_regressions,
              "instrument_date_regressions": instrument_date_regressions,
              "instrument_date_regression_samples": instrument_date_samples,
              "source_order_classified_by_row_reconciliation": f6.get("mismatch_count") == 0,
              "blockers": blockers, "exceptions": exceptions,
              "weekday_distribution": dict(weekday_counts), "weekend_dates_observed": weekend_dates,
              "calendar_gaps_over_4_days": gaps, "official_calendar_reference": "NOT_PERSISTED",
              "deduplication_performed": False, "rows_removed": 0,
              "validated_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          ev_path.parent.mkdir(parents=True, exist_ok=True)
          ev_path.write_text(json.dumps(out, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(out, ensure_ascii=False, indent=2))
          if not valid:
              sys.exit("FASE08 BLOQUEADA: regressões temporais exigem revisão")
          PY

      - name: Persistir evidência FASE08 inclusive quando bloqueada
        if: always()
        run: |
          set -euo pipefail
          test -s dados/cotahist/quality/COTAHIST_2019_FASE08_SEMANTICA_CALENDARIO_V1.json || {
            echo "Evidência FASE08 não produzida; pré-condição falhou."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_2019_FASE08_SEMANTICA_CALENDARIO_V1.json
          git diff --cached --quiet && exit 0
          git commit -m "audit(cotahist): registrar calendario e consistencia fase 08 2019"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            echo "Push concorrente; nova tentativa ${attempt}/5."
            sleep $((attempt * 2))
          done
          echo "Falha de persistência após 5 tentativas."
          exit 1

      - name: Resumo operacional
        if: always()
        run: |
          {
            echo "## COTAHIST 2019 — FASE08"
            echo "- Valida datas e consistência temporal sem reordenar/remover linhas."
            echo "- Não certifica equivalência com calendário oficial B3."
            echo "- Resultado do job: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
