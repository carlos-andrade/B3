name: COTAHIST FASE 08C - Padrão Negociação Arredores 1986 V1

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/ingestao/analisar_padrao_negociacao_arredores_1986_v1.py"
      - ".github/workflows/cotahist-fase08c-padrao-negociacao-arredores-1986-v1.yml"
      - "dados/cotahist/raw/anual/COTAHIST_A1986.ZIP"
      - "dados/cotahist/quality/COTAHIST_1986_EVIDENCIA_DIAS_UTEIS_AUSENTES_V1.json"

permissions:
  contents: write

jobs:
  analisar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Executar FASE 08C
        run: |
          python scripts/ingestao/analisar_padrao_negociacao_arredores_1986_v1.py \
            --zip dados/cotahist/raw/anual/COTAHIST_A1986.ZIP \
            --evidence dados/cotahist/quality/COTAHIST_1986_EVIDENCIA_DIAS_UTEIS_AUSENTES_V1.json \
            --output dados/cotahist/quality/COTAHIST_1986_PADRAO_NEGOCIACAO_ARREDORES_V1.json
      - name: Publicar evidência
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_1986_PADRAO_NEGOCIACAO_ARREDORES_V1.json
          git diff --cached --quiet || git commit -m "data(cotahist): publicar evidencia fase 08c 1986"
          git push
