name: COTAHIST - teste de normalização

on:
  push:
    paths:
      - "scripts/ingestao/normalize_cotahist.py"
      - ".github/workflows/cotahist-normalizacao-teste.yml"
  workflow_dispatch:
    inputs:
      year:
        description: "Ano COTAHIST a normalizar"
        required: true
        default: "1986"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Selecionar ano
        shell: bash
        run: |
          set -euo pipefail
          year="${{ inputs.year || '1986' }}"
          test "$year" -ge 1986
          echo "ANO=$year" >> "$GITHUB_ENV"

      - name: Normalizar COTAHIST
        shell: bash
        run: |
          set -euo pipefail
          year="$ANO"
          zip="dados/cotahist/raw/anual/COTAHIST_A${year}.ZIP"
          test -s "$zip"
          mkdir -p /tmp/normalized /tmp/quality
          python scripts/ingestao/normalize_cotahist.py \
            --zip "$zip" \
            --output "/tmp/normalized/COTAHIST_A${year}.csv"

      - name: Auditoria de qualidade e manifesto
        shell: bash
        run: |
          set -euo pipefail
          year="$ANO"
          zip="dados/cotahist/raw/anual/COTAHIST_A${year}.ZIP"
          csv="/tmp/normalized/COTAHIST_A${year}.csv"
          report="/tmp/quality/COTAHIST_A${year}_quality.json"
          sha256sum "$csv" | awk '{print $1}' > "/tmp/quality/COTAHIST_A${year}.csv.sha256"
          raw_sha256="$(sha256sum "$zip" | awk '{print $1}')"
          normalized_sha256="$(cat "/tmp/quality/COTAHIST_A${year}.csv.sha256")"
          python - "$csv" "$report" "$year" "$raw_sha256" "$normalized_sha256" <<'PY'
          import csv, json, sys
          from collections import Counter
          from datetime import datetime
          from pathlib import Path

          csv_path = Path(sys.argv[1])
          report_path = Path(sys.argv[2])
          year = int(sys.argv[3])
          raw_sha256 = sys.argv[4]
          normalized_sha256 = sys.argv[5]

          with csv_path.open(encoding="utf-8", newline="") as f:
              reader = csv.DictReader(f)
              rows = list(reader)
              fieldnames = reader.fieldnames or []

          if not rows:
              raise SystemExit("NORMALIZED sem registros")

          required = {
              "data_pregao", "codbdi", "codneg", "tpmerc", "nomres",
              "preabe", "premax", "premin", "premed", "preult",
              "totneg", "quatot", "voltot", "codisi", "dismes"
          }
          missing = sorted(required - set(fieldnames))
          if missing:
              raise SystemExit(f"campos ausentes: {missing}")

          dates = [r["data_pregao"] for r in rows if r["data_pregao"]]
          bad_dates = []
          for d in dates:
              try:
                  datetime.strptime(d, "%Y-%m-%d")
              except ValueError:
                  bad_dates.append(d)

          wrong_year = [d for d in dates if not d.startswith(f"{year}-")]
          keys = [
              (r["data_pregao"], r["codbdi"], r["codneg"], r["tpmerc"], r["dismes"])
              for r in rows
          ]
          duplicate_rows = sum(c - 1 for c in Counter(keys).values() if c > 1)

          report = {
              "schema_version": "1.0.0",
              "status": "VALIDADO" if not bad_dates and not wrong_year else "REVISAR",
              "ano": year,
              "parser_version": "1.1.0",
              "source": "B3",
              "raw_file": f"COTAHIST_A{year}.ZIP",
              "raw_sha256": raw_sha256,
              "normalized_file": f"COTAHIST_A{year}.csv",
              "normalized_sha256": normalized_sha256,
              "linhas_normalized": len(rows),
              "campos": len(fieldnames),
              "primeira_data": min(dates),
              "ultima_data": max(dates),
              "datas_invalidas": len(bad_dates),
              "datas_fora_do_ano": len(wrong_year),
              "duplicidades_chave_candidata": duplicate_rows,
              "chave_candidata": ["data_pregao", "codbdi", "codneg", "tpmerc", "dismes"],
              "evidencia": "NORMALIZED derivado do RAW validado; RAW permanece a fonte primária."
          }
          report_path.write_text(
              json.dumps(report, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8"
          )
          print(json.dumps(report, indent=2, ensure_ascii=False))

          if bad_dates or wrong_year:
              raise SystemExit("falha de qualidade de datas")
          PY

      - name: Persistir evidências auditáveis
        shell: bash
        run: |
          set -euo pipefail
          year="$ANO"
          mkdir -p "dados/cotahist/normalized/manifests"
          cp "/tmp/quality/COTAHIST_A${year}_quality.json" "dados/cotahist/normalized/manifests/COTAHIST_A${year}_quality.json"
          cp "/tmp/quality/COTAHIST_A${year}.csv.sha256" "dados/cotahist/normalized/manifests/COTAHIST_A${year}.csv.sha256"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "dados/cotahist/normalized/manifests/COTAHIST_A${year}_quality.json" "dados/cotahist/normalized/manifests/COTAHIST_A${year}.csv.sha256"
          git commit -m "data(normalized): persistir evidência COTAHIST ${year}" || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publicar evidências temporárias
        uses: actions/upload-artifact@v4
        with:
          name: cotahist-normalized-${{ env.ANO }}
          path: |
            /tmp/normalized/COTAHIST_A${{ env.ANO }}.csv
            /tmp/quality/COTAHIST_A${{ env.ANO }}_quality.json
            /tmp/quality/COTAHIST_A${{ env.ANO }}.csv.sha256
          if-no-files-found: error
          retention-days: 30
