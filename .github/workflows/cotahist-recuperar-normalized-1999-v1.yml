name: COTAHIST 1999 - Recuperar CSV normalizado

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cotahist-recuperar-normalized-1999-v1.yml"
      - "scripts/ingestao/normalize_cotahist.py"
      - "dados/cotahist/quality/COTAHIST_1999_FASE03_PARSING_V1.json"

permissions:
  contents: write

concurrency:
  group: cotahist-recuperar-normalized-1999-v1
  cancel-in-progress: false

jobs:
  recuperar-e-auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerar CSV a partir do RAW preservado
        run: |
          set -euo pipefail
          test -s dados/cotahist/raw/anual/COTAHIST_A1999.ZIP
          python scripts/ingestao/normalize_cotahist.py \
            --zip dados/cotahist/raw/anual/COTAHIST_A1999.ZIP \
            --output dados/cotahist/normalized/anual/COTAHIST_A1999.csv

      - name: Validar estrutura e produzir auditoria sem promoção automática
        run: |
          python - <<'PY'
          import csv, hashlib, json, datetime, sys
          from pathlib import Path
          raw = Path("dados/cotahist/raw/anual/COTAHIST_A1999.ZIP")
          csv_path = Path("dados/cotahist/normalized/anual/COTAHIST_A1999.csv")
          manifest_path = Path("dados/cotahist/normalized/manifests/COTAHIST_A1999_quality.json")
          sidecar_path = Path("dados/cotahist/normalized/manifests/COTAHIST_A1999.csv.sha256")
          evidence_path = Path("dados/cotahist/quality/COTAHIST_1999_FASE04_RECUPERACAO_V1.json")
          for path in (raw, csv_path, manifest_path, sidecar_path):
              if not path.is_file() or path.stat().st_size == 0:
                  sys.exit(f"FAIL-CLOSED: arquivo ausente/vazio: {path}")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          raw_sha = hashlib.sha256(raw.read_bytes()).hexdigest()
          csv_sha = hashlib.sha256(csv_path.read_bytes()).hexdigest()
          sidecar_sha = sidecar_path.read_text(encoding="utf-8").strip().split()[0]
          expected_raw_sha = "fe7428b367a2d40acaefe823fd5080254d07f9ad6c29fc64c9e6876cbd876f09"
          if raw_sha != expected_raw_sha or raw_sha != manifest.get("raw_sha256"):
              sys.exit(f"FAIL-CLOSED: integridade RAW divergente: {raw_sha}")
          with csv_path.open(encoding="utf-8", newline="") as f:
              reader = csv.DictReader(f)
              fields = reader.fieldnames or []
              rows = list(reader)
          if len(fields) != 25 or any(len(row) != 25 for row in rows):
              sys.exit("FAIL-CLOSED: CSV deve conter 25 campos por registo")
          dates = [row.get("data_pregao", "") for row in rows]
          if not dates or any(not d.startswith("1999-") for d in dates):
              sys.exit("FAIL-CLOSED: datas ausentes ou fora de 1999")
          count_ok = len(rows) == manifest.get("linhas_normalized")
          dates_ok = min(dates) == manifest.get("primeira_data") and max(dates) == manifest.get("ultima_data")
          manifest_sha_ok = csv_sha == manifest.get("normalized_sha256")
          sidecar_sha_ok = csv_sha == sidecar_sha
          phase03_path = Path("dados/cotahist/quality/COTAHIST_1999_FASE03_PARSING_V1.json")
          phase03_status = "PRESENTE" if phase03_path.is_file() else "AUSENTE"
          fully_matched = count_ok and dates_ok and manifest_sha_ok and sidecar_sha_ok
          evidence = {
            "schema_version": "1.0.0",
            "ano": 1999,
            "fase": "FASE04",
            "status": "EVIDENCIA_RECONSTRUIDA_AGUARDA_GATE" if fully_matched and phase03_status == "PRESENTE" else "BLOQUEADO_PARA_PROMOCAO",
            "decision": "AGUARDA_VALIDACAO_INDEPENDENTE",
            "recuperacao": "REGENERACAO_DETERMINISTICA_A_PARTIR_DO_RAW_IMUTAVEL",
            "raw_path": str(raw),
            "raw_sha256_calculado": raw_sha,
            "raw_sha256_esperado": expected_raw_sha,
            "csv_path": str(csv_path),
            "csv_sha256_calculado": csv_sha,
            "csv_sha256_manifesto": manifest.get("normalized_sha256"),
            "csv_sha256_sidecar": sidecar_sha,
            "sha256_manifesto_coincide": manifest_sha_ok,
            "sha256_sidecar_coincide": sidecar_sha_ok,
            "linhas_calculadas": len(rows),
            "linhas_manifesto": manifest.get("linhas_normalized"),
            "contagem_coincide": count_ok,
            "campos": len(fields),
            "primeira_data_calculada": min(dates),
            "ultima_data_calculada": max(dates),
            "datas_coincidem_manifesto": dates_ok,
            "evidencia_fase03": str(phase03_path),
            "evidencia_fase03_status": phase03_status,
            "raw_alterado": False,
            "deduplicacao_aplicada": False,
            "promocao_automatica": False,
            "blockers": [reason for reason, ok in [
              ("contagem de linhas diverge do manifesto", count_ok),
              ("datas divergem do manifesto", dates_ok),
              ("SHA-256 diverge do manifesto", manifest_sha_ok),
              ("SHA-256 diverge do sidecar", sidecar_sha_ok),
              ("evidência canónica da FASE03 ausente", phase03_status == "PRESENTE")
            ] if not ok],
            "audit_timestamp_utc": datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          evidence_path.parent.mkdir(parents=True, exist_ok=True)
          evidence_path.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(evidence, ensure_ascii=False, indent=2))
          PY

      - name: Persistir CSV recuperado e auditoria
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/normalized/anual/COTAHIST_A1999.csv dados/cotahist/quality/COTAHIST_1999_FASE04_RECUPERACAO_V1.json
          if git diff --cached --quiet; then
            echo "Sem alterações para persistir."
            exit 0
          fi
          git commit -m "fix(cotahist): recuperar CSV normalizado 1999 e auditar integridade"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Resumo
        if: always()
        run: |
          {
            echo "## COTAHIST 1999 — recuperação"
            echo "- O RAW original não é alterado."
            echo "- Divergências de hash/manifesto ficam registadas; não são corrigidas silenciosamente."
            echo "- A recuperação não certifica FASE04/05 nem desbloqueia FASE06 automaticamente."
            echo "- Resultado do job: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
