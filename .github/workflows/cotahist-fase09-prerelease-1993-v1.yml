name: COTAHIST - pre-release retrospectivo 1993 FASE09 V1
on:
  push:
    paths:
      - "dados/cotahist/quality/COTAHIST_1993_FASE02_INTEGRIDADE_FONTE_V1.json"
      - "dados/cotahist/quality/COTAHIST_1993_FASE06_RECONCILIACAO_V1.json"
      - "dados/cotahist/quality/COTAHIST_1993_FASE07_IDENTIDADE_CHAVES_V1.json"
      - "dados/cotahist/quality/COTAHIST_1993_FASE08_SEMANTICA_CALENDARIO_V1.json"
      - "dados/cotahist/normalized/manifests/COTAHIST_A1993_quality.json"
      - "dados/cotahist/normalized/anual/COTAHIST_A1993.csv"
      - "dados/cotahist/raw/anual/COTAHIST_A1993.ZIP"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - name: Avaliar pre-release
        id: gate
        run: |
          python - <<'PY'
          import json, pathlib, sys
          y="1993"; q=pathlib.Path("dados/cotahist/quality")
          paths={
            "P02":q/f"COTAHIST_{y}_FASE02_INTEGRIDADE_FONTE_V1.json",
            "P06":q/f"COTAHIST_{y}_FASE06_RECONCILIACAO_V1.json",
            "P07":q/f"COTAHIST_{y}_FASE07_IDENTIDADE_CHAVES_V1.json",
            "P08":q/f"COTAHIST_{y}_FASE08_SEMANTICA_CALENDARIO_V1.json",
            "P05":pathlib.Path(f"dados/cotahist/normalized/manifests/COTAHIST_A{y}_quality.json"),
            "P04":pathlib.Path(f"dados/cotahist/normalized/anual/COTAHIST_A{y}.csv"),
            "P01":pathlib.Path(f"dados/cotahist/raw/anual/COTAHIST_A{y}.ZIP")}
          missing=[k for k,p in paths.items() if not p.exists()]
          statuses={}
          for k in ("P02","P06","P07","P08"):
            if k not in missing:
              try: statuses[k]=json.loads(paths[k].read_text(encoding="utf-8")).get("status")
              except Exception: statuses[k]="INVALID_JSON"
          blocked=[k for k,v in statuses.items() if v not in ("VALIDADO","VALIDADO_COM_EXCECAO")]
          ok=not missing and not blocked
          out={"schema_version":"1.0.0","year":1993,"phase":"FASE09","status":"LIBERADO_PARA_FASE10" if ok else "BLOQUEADO","preconditions":{k:("OK" if k not in missing else "AUSENTE") for k in paths},"evidence_statuses":statuses,"missing":missing,"blocked":blocked,"decision":"LIBERADO_PARA_FASE10" if ok else "BLOQUEADO","note":"Pre-release somente consolida evidencias anteriores; nao retrocertifica fases ausentes."}
          (q/f"COTAHIST_{y}_FASE09_PRE_RELEASE_V1.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False))
          if not ok: sys.exit(1)
          PY
      - name: Publicar FASE09
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_1993_FASE09_PRE_RELEASE_V1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit(cotahist): pre-release retrospectivo 1993 fase 09"
          git push
