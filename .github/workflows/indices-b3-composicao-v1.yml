name: B3 Indices - composicao de carteiras V1

on:
  push:
    paths:
      - "scripts/ingestao/importar_indices_b3_v1.py"
      - ".github/workflows/indices-b3-composicao-v1.yml"
      - "governanca/indices_b3/INVENTARIO_INDICES_B3_V1.md"
  schedule:
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indices-b3-composicao-v1
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capturar e validar composicoes
        run: python scripts/ingestao/importar_indices_b3_v1.py

      - name: Persistir dados e manifestos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/indices_b3
          git diff --cached --quiet && exit 0
          git commit -m "data(indices): atualizar composicoes B3"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publicar manifestos
        uses: actions/upload-artifact@v4
        with:
          name: indices-b3-composicao-v1
          path: dados/indices_b3/manifests/*.json
          retention-days: 30
