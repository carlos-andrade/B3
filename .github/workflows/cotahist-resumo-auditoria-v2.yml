name: COTAHIST - resumir auditoria V2

on:
  push:
    paths:
      - "dados/cotahist/quality/COTAHIST_1986_2026_continuidade_v2.json"
      - "scripts/ingestao/resumir_auditoria_cotahist_v2.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          python scripts/ingestao/resumir_auditoria_cotahist_v2.py             dados/cotahist/quality/COTAHIST_1986_2026_continuidade_v2.json             dados/cotahist/quality/COTAHIST_1986_2026_resumo_v2.json
      - name: Persistir resumo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_1986_2026_resumo_v2.json
          git commit -m "data(quality): publicar resumo auditoria COTAHIST V2" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

# trigger summary execution
