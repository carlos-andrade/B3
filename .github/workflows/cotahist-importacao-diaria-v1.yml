name: COTAHIST - importacao diaria automatica V1
# Execucao de reconciliação operacional RAW/normalizado em 2026-10-16.
# reconciliacao anual V1 streaming
# append incremental validado
# indice oficial corrente composto

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cotahist-importacao-diaria-v1.yml"
      - "scripts/ingestao/importar_cotahist_diario_v1.py"
      - "scripts/ingestao/reconciliar_cotahist_anual_v1.py"
      - "scripts/governanca/validar_autorizacao_endpoint.py"
      - "scripts/governanca/test_validar_autorizacao_endpoint.py"
      - "docs/governanca/licenciamento/REGISTRO_AUTORIZACOES_ENDPOINTS_B3_2026-10-16.json"
  pull_request:
    paths:
      - ".github/workflows/cotahist-importacao-diaria-v1.yml"
      - "scripts/ingestao/importar_cotahist_diario_v1.py"
      - "scripts/ingestao/reconciliar_cotahist_anual_v1.py"
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cotahist-importacao-diaria-v1
  cancel-in-progress: false

jobs:
  authorization_gate:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Testar os controlos de autorização
        run: python -m unittest scripts/governanca/test_validar_autorizacao_endpoint.py -v
      - name: Verificar autorização de uso do endpoint COTAHIST
        id: gate
        run: python scripts/governanca/validar_autorizacao_endpoint.py --endpoint-id B3_COTAHIST_DAILY --allow-blocked --github-output "$GITHUB_OUTPUT"

  import:
    needs: authorization_gate
    if: needs.authorization_gate.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Atualizar branch após espera de concorrência
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Importar e validar COTAHIST diário
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/ingestao/importar_cotahist_diario_v1.py

      - name: Reconciliar Dataset Anual 2026
        run: python scripts/ingestao/reconciliar_cotahist_anual_v1.py

      - name: Persistir atualização
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pushed=0
          for attempt in 1 2 3 4 5; do
            # Cada tentativa reconstrói a importação em cima do HEAD corrente de main.
            # Não fazer rebase de artefactos de dados potencialmente concorrentes.
            git fetch origin main
            git reset --hard origin/main
            python scripts/ingestao/importar_cotahist_diario_v1.py
            python scripts/ingestao/reconciliar_cotahist_anual_v1.py
            git add dados/cotahist/raw/diario dados/cotahist/normalized/diario dados/cotahist/normalized/manifests/diario dados/cotahist/quality/diario dados/cotahist/oficial/COTAHIST_DATASET_ATUAL_V1.1.json
            if git diff --cached --quiet; then
              echo "Sem alterações novas para persistir."
              pushed=1
              break
            fi
            git commit -m "data(cotahist): importacao diaria automatica"
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "HEAD de main mudou durante persistência (tentativa $attempt/5); recalcular a partir do HEAD atual."
            sleep $((attempt * 2))
          done
          test "$pushed" -eq 1

      - name: Gate de conflitos após persistência
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          reports = sorted(Path("dados/cotahist/quality/diario/execucoes").glob("COTAHIST_DIARIO_EXECUCAO_*.json"))
          if not reports:
              raise SystemExit("RELATORIO_EXECUCAO_AUSENTE")
          report = json.loads(reports[-1].read_text(encoding="utf-8"))
          print(json.dumps({"relatorio": str(reports[-1]), "status": report["status"], "dias_com_conflito": report["dias_com_conflito"]}, ensure_ascii=False))
          if report["status"] != "EXECUCAO_SEM_CONFLITOS":
              raise SystemExit("CONFLITO_FONTE: dados canónicos preservados; rever evidência persistida")
          PY

      - name: Publicar evidências
        uses: actions/upload-artifact@v4
        with:
          name: cotahist-importacao-diaria-v1
          path: |
            dados/cotahist/normalized/manifests/diario/*.json
            dados/cotahist/quality/diario/execucoes/*.json
            dados/cotahist/quality/diario/conflitos/*.json
          retention-days: 30

      - name: Resumo de execução — observabilidade
        if: always()
        run: |
          {
            echo "## Observabilidade"
            echo "- Workflow: cotahist-importacao-diaria-v1.yml"
            echo "- Resultado do job: ${{ job.status }}"
            echo "- GITHUB_STEP_SUMMARY: habilitado"
          } >> "$GITHUB_STEP_SUMMARY"
