name: B3 — Catálogo de instrumentos — gate de autorização

# O endpoint usado pelo importador é associado à interface Pesquisa por Pregão,
# cuja página oficial proíbe recolha automatizada. Não fazer chamadas de rede
# até existir canal alternativo oficial ou autorização documentada aplicável.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/atualizar-catalogo-b3.yml"
      - "docs/governanca/licenciamento/REGISTRO_AUTORIZACOES_ENDPOINTS_B3_2026-10-16.json"
      - "scripts/governanca/validar_autorizacao_endpoint.py"

permissions:
  contents: read

concurrency:
  group: b3-catalogo-autorizacao-gate
  cancel-in-progress: false

jobs:
  verificar-autorizacao:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Avaliar autorização registada sem chamar o endpoint
        shell: bash
        run: |
          set -euo pipefail
          result="$(python scripts/governanca/validar_autorizacao_endpoint.py \
            --endpoint-id B3_PESQUISA_POR_PREGAO_API --allow-blocked)"
          echo "$result"
          python - "$result" <<'PY'
          import json
          import os
          import sys
          result = json.loads(sys.argv[1])
          summary = [
              "# Catálogo B3 — gate de autorização",
              f"- Estado: **{result['authorization_status']}**",
              f"- Captura automatizada autorizada pelo registo: **{result['authorized']}**",
              f"- Decisão: {result['reason']}",
              "- Chamadas HTTP ao endpoint de catálogo: **0**",
              "- Próxima ação: confirmar canal oficial de download/API fora da interface restrita ou obter autorização documentada.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(summary) + "\n")
          if result["authorized"] is True:
              raise SystemExit("Rever este workflow antes de reativar a captura; o gate não implementa o importador.")
          PY
