name: COTAHIST - auditoria retrospectiva 1993 FASE01 V1

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/ingestao/auditar_cotahist_1993_fase01_v1.py"
      - "dados/cotahist/raw/anual/COTAHIST_A1993.ZIP"
      - "dados/cotahist/manifests/COTAHIST_A1993.json"
      - "dados/cotahist/checksums/COTAHIST_A1993.ZIP.sha256"

permissions:
  contents: write

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Executar FASE01
        run: python scripts/ingestao/auditar_cotahist_1993_fase01_v1.py
      - name: Publicar evidencia
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_1993_FASE01_AQUISICAO_RAW_V1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit(cotahist): publica evidencia retrospectiva 1993 fase 01"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep 2
          done
          exit 1
