name: B3 - Monitor independente de execuções V1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/b3-monitor-execucoes-v1.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: b3-monitor-execucoes
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Monitorar execuções recentes e gerar evidência
        id: monitor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, datetime
          from collections import Counter
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          now = datetime.datetime.now(datetime.timezone.utc)
          cutoff = now - datetime.timedelta(hours=24)
          recent = []
          page = 1
          pages_fetched = 0
          while True:
              raw = subprocess.check_output([
                  "gh", "api", "-X", "GET",
                  f"repos/{repo}/actions/runs?per_page=100&page={page}"
              ], text=True)
              data = json.loads(raw)
              page_runs = data.get("workflow_runs", [])
              pages_fetched += 1
              if not page_runs:
                  break
              page_dates = []
              for run in page_runs:
                  created = datetime.datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
                  page_dates.append(created)
                  if created >= cutoff:
                      recent.append(run)
              # GitHub returns workflow runs newest-first; once a full page is
              # entirely older than the cutoff, older pages cannot contribute.
              if all(created < cutoff for created in page_dates) or len(page_runs) < 100:
                  break
              page += 1

          counts = Counter(run["conclusion"] or run["status"] for run in recent)
          unfavorable = {"failure", "timed_out", "action_required", "stale"}
          bad = [run for run in recent if (run["conclusion"] or run["status"]) in unfavorable]
          bad_by_workflow = Counter(run["name"] for run in bad)
          active_states = {"queued", "in_progress", "waiting", "requested", "pending"}
          active = [run for run in recent if run["status"] in active_states]
          overall = "NAO_FAVORAVEL" if bad else ("EM_EXECUCAO" if active else "FAVORAVEL")

          report = {
              "schema_version": 1,
              "project": "B3",
              "monitor": "b3-monitor-execucoes-v1",
              "checked_at_utc": now.isoformat(),
              "window_hours": 24,
              "result": overall,
              "runs_observed": len(recent),
              "pages_fetched": pages_fetched,
              "distribution": dict(counts),
              "unfavorable_count": len(bad),
              "active_count": len(active),
              "unfavorable_by_workflow": dict(bad_by_workflow.most_common()),
              "unfavorable_runs": [
                  {"name": r["name"], "run_number": r["run_number"],
                   "status": r["status"], "conclusion": r["conclusion"],
                   "url": r["html_url"], "created_at": r["created_at"]}
                  for r in bad
              ],
              "active_runs": [
                  {"name": r["name"], "run_number": r["run_number"],
                   "status": r["status"], "url": r["html_url"],
                   "created_at": r["created_at"]}
                  for r in active
              ],
              "limitations": [
                  "O relatório pagina a API até ultrapassar a janela móvel de 24 horas; páginas antigas não são consultadas depois do corte.",
                  "A execução do próprio monitor precisa de supervisão externa independente.",
                  "FAVORAVEL não certifica a qualidade dos dados de negócio."
              ]
          }
          Path("watchdog-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )

          lines = [
              "# Resultado do monitor B3",
              "",
              f"**Resultado:** {overall}",
              f"**Verificado em UTC:** {now.isoformat()}",
              "**Janela:** últimas 24 horas",
              f"**Execuções observadas:** {len(recent)}",
              f"**Páginas consultadas:** {pages_fetched}",
              f"**Falhas/desfavoráveis:** {len(bad)}",
              f"**Execuções ativas:** {len(active)}",
              f"**Distribuição:** {dict(counts)}",
              "",
              "## Falhas agrupadas por workflow"
          ]
          if bad_by_workflow:
              lines.extend([f"- {name}: {count}" for name, count in bad_by_workflow.most_common(20)])
          else:
              lines.append("- Nenhuma.")
          lines += ["", "## Execuções não favoráveis"]
          if bad:
              lines.extend([
                  f"- {r['name']} | run #{r['run_number']} | {r['conclusion'] or r['status']} | {r['html_url']}"
                  for r in bad[:100]
              ])
          else:
              lines.append("- Nenhuma.")
          if len(bad) > 100:
              lines += ["", f"**Nota:** são {len(bad)} execuções desfavoráveis no total; a issue mostra as primeiras 100. O artefacto JSON contém a lista completa."]
          lines += ["", "## Execuções em andamento"]
          if active:
              lines.extend([
                  f"- {r['name']} | run #{r['run_number']} | {r['status']} | {r['html_url']}"
                  for r in active[:100]
              ])
          else:
              lines.append("- Nenhuma.")
          lines += ["", "## Limitações", *[f"- {x}" for x in report["limitations"]]]
          summary = "\n".join(lines) + "\n"
          Path("watchdog-report.md").write_text(summary, encoding="utf-8")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(summary, encoding="utf-8")
          Path("watchdog-alert.md").write_text(
              summary + f"\n**Workflow do monitor:** https://github.com/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}\n",
              encoding="utf-8"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"result={overall}\n")
              out.write(f"has_unfavorable={'true' if bad else 'false'}\n")
          print(summary)
          PY

      - name: Criar ou atualizar alerta no GitHub
        if: steps.monitor.outputs.has_unfavorable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="[WATCHDOG] Execuções desfavoráveis — B3"
          issue_number="$(gh issue list --state open --search '"[WATCHDOG] Execuções desfavoráveis" in:title' --json number,title --jq '.[] | select(.title == "[WATCHDOG] Execuções desfavoráveis — B3") | .number' | head -n 1 || true)"
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --body-file watchdog-alert.md
            echo "Alerta existente atualizado: issue #$issue_number"
          else
            gh issue create --title "$title" --body-file watchdog-alert.md
          fi

      - name: Heartbeat para supervisor externo (opcional)
        env:
          WATCHDOG_HEARTBEAT_URL: ${{ secrets.WATCHDOG_HEARTBEAT_WORKFLOWS_URL }}
        run: |
          set -euo pipefail
          if [ -z "$WATCHDOG_HEARTBEAT_URL" ]; then
            echo "::warning::WATCHDOG_HEARTBEAT_WORKFLOWS_URL não configurado; supervisão independente permanece inativa."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 10 "$WATCHDOG_HEARTBEAT_URL"

      - name: Publicar evidência da execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchdog-b3-evidence-${{ github.run_id }}
          path: |
            watchdog-report.json
            watchdog-report.md
            watchdog-alert.md
          if-no-files-found: warn
          retention-days: 30
