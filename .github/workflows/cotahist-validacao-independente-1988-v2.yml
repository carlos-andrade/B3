# ID: B3-COTAHIST-1988-INDEPENDENT-VALIDATION-V2-READONLY
# Estado: validação isolada; a evidência canónica é propriedade da V1.
name: COTAHIST 1988 - Validacao Independente V2

on:
  push:
    paths:
      - "scripts/ingestao/validar_independente_cotahist_1988_v1.py"
      - ".github/workflows/cotahist-validacao-independente-1988-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cotahist-validacao-independente-1988-v2
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Executar validacao independente
        run: python scripts/ingestao/validar_independente_cotahist_1988_v1.py
      - name: Validar gates
        run: |
          python - <<'PY'
          import json
          d=json.load(open('dados/cotahist/quality/COTAHIST_1988_VALIDACAO_INDEPENDENTE_V1.json',encoding='utf-8'))
          assert all(d['validation_gates'].values())
          assert d['decision']['independent_validation_passed']
          assert d['governance']['raw_immutable']
          assert d['governance']['no_correction']
          assert not d['decision']['exceptions_resolved']
          print('PHASE10_GATES_OK')
          PY
      - name: Publicar evidência isolada como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: cotahist-validacao-independente-1988-v2-diagnostic
          path: dados/cotahist/quality/COTAHIST_1988_VALIDACAO_INDEPENDENTE_V1.json
          retention-days: 30
