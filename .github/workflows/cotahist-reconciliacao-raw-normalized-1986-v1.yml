name: COTAHIST - reconciliacao RAW NORMALIZED 1986 V1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cotahist-reconciliacao-raw-normalized-1986
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconciliar RAW -> NORMALIZED
        shell: bash
        run: |
          set -euo pipefail
          test -s dados/cotahist/raw/anual/COTAHIST_A1986.ZIP
          test -s dados/cotahist/normalized/manifests/COTAHIST_A1986_quality.json
          python scripts/ingestao/reconciliar_raw_normalized_cotahist_1986_v1.py             --year 1986             --raw dados/cotahist/raw/anual/COTAHIST_A1986.ZIP             --manifest dados/cotahist/normalized/manifests/COTAHIST_A1986_quality.json             --parser scripts/ingestao/normalize_cotahist.py             --output dados/cotahist/quality/COTAHIST_1986_RECONCILIACAO_RAW_NORMALIZED_V1.json

      - name: Persistir evidencia
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_1986_RECONCILIACAO_RAW_NORMALIZED_V1.json
          git commit -m "data(cotahist): reconciliar RAW e NORMALIZED 1986" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publicar evidencia
        uses: actions/upload-artifact@v4
        with:
          name: cotahist-reconciliacao-raw-normalized-1986-v1
          path: dados/cotahist/quality/COTAHIST_1986_RECONCILIACAO_RAW_NORMALIZED_V1.json
          retention-days: 30
