name: COTAHIST 1986 - Auditoria de Calendario V1\n# V1.0.3 - auditoria final de registros de fim de semana

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/ingestao/auditar_calendario_cotahist_1986_v1.py"
      - ".github/workflows/cotahist-calendario-1986-v1.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Auditar calendario observavel
        run: |
          python scripts/ingestao/auditar_calendario_cotahist_1986_v1.py \
            --zip dados/cotahist/raw/anual/COTAHIST_A1986.ZIP \
            --output dados/cotahist/quality/COTAHIST_1986_AUDITORIA_CALENDARIO_V1.json
      - name: Persistir resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_1986_AUDITORIA_CALENDARIO_V1.json
          git diff --cached --quiet || git commit -m "data(cotahist): auditoria observavel calendario 1986"
          git pull --rebase origin main
          git push
