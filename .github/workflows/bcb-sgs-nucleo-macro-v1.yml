name: BCB SGS - nucleo macro V1
# Execucao automatica + manual; certificacao depende de evidencias persistidas.

on:
  push:
    paths:
      - "scripts/ingestao/importar_bcb_sgs_nucleo_macro_v1.py"
      - ".github/workflows/bcb-sgs-nucleo-macro-v1.yml"
      - "governanca/bcb_sgs/INVENTARIO_BCB_SGS_NUCLEO_MACRO_V1.md"
      - "scripts/governanca/validar_licenca_bcb_sgs.py"
      - "tests/governanca/test_validar_licenca_bcb_sgs.py"
  schedule:
    - cron: "20 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bcb-sgs-nucleo-macro-v1
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Testar preflight de licenças ODbL
        run: python -m unittest tests.governanca.test_validar_licenca_bcb_sgs -v

      - name: Ingerir e validar BCB SGS
        run: python scripts/ingestao/importar_bcb_sgs_nucleo_macro_v1.py

      - name: Persistir dados e manifestos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/bcb_sgs scripts/ingestao/importar_bcb_sgs_nucleo_macro_v1.py scripts/governanca/validar_licenca_bcb_sgs.py tests/governanca/test_validar_licenca_bcb_sgs.py governanca/bcb_sgs
          git diff --cached --quiet && exit 0
          git commit -m "data(bcb): atualizar nucleo macro SGS"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publicar manifestos
        uses: actions/upload-artifact@v4
        with:
          name: bcb-sgs-nucleo-macro-v1
          path: dados/bcb_sgs/manifests/*.json
          retention-days: 30

      - name: Resumo de execução — observabilidade
        if: always()
        run: |
          {
            echo "## Observabilidade"
            echo "- Workflow: bcb-sgs-nucleo-macro-v1.yml"
            echo "- Resultado do job: ${{ job.status }}"
            echo "- GITHUB_STEP_SUMMARY: habilitado"
          } >> "\$GITHUB_STEP_SUMMARY"
