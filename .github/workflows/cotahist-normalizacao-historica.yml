name: COTAHIST - normalizacao historica 1986-2026

on:
  push:
    paths:
      - ".github/workflows/cotahist-normalizacao-historica.yml"
      - "scripts/ingestao/normalize_cotahist.py"
  workflow_dispatch:
    inputs:
      start_year:
        description: "Primeiro ano a normalizar"
        required: true
        default: "1986"
      end_year:
        description: "Ultimo ano a normalizar"
        required: true
        default: "2026"

permissions:
  contents: write

concurrency:
  group: cotahist-normalizacao-historica
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        year: [1986, 1987, 1988, 1989, 1990, 1991, 1992, 1993, 1994, 1995, 1996, 1997, 1998, 1999, 2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar janela solicitada
        shell: bash
        run: |
          set -euo pipefail
          start="${{ inputs.start_year || '1986' }}"
          end="${{ inputs.end_year || '2026' }}"
          year="${{ matrix.year }}"
          test "$start" -ge 1986
          test "$end" -ge "$start"
          test "$year" -ge "$start"
          test "$year" -le "$end"
          echo "ANO=$year" >> "$GITHUB_ENV"

      - name: Normalizar COTAHIST
        shell: bash
        run: |
          set -euo pipefail
          year="$ANO"
          zip="dados/cotahist/raw/anual/COTAHIST_A${year}.ZIP"
          test -s "$zip"
          mkdir -p /tmp/normalized /tmp/quality
          python scripts/ingestao/normalize_cotahist.py \
            --zip "$zip" \
            --output "/tmp/normalized/COTAHIST_A${year}.csv"

      - name: Auditar e gerar manifesto
        shell: bash
        run: |
          set -euo pipefail
          year="$ANO"
          zip="dados/cotahist/raw/anual/COTAHIST_A${year}.ZIP"
          csv="/tmp/normalized/COTAHIST_A${year}.csv"
          report="/tmp/quality/COTAHIST_A${year}_quality.json"
          sha256sum "$csv" | awk '{print $1}' > "/tmp/quality/COTAHIST_A${year}.csv.sha256"
          raw_sha256="$(sha256sum "$zip" | awk '{print $1}')"
          normalized_sha256="$(cat "/tmp/quality/COTAHIST_A${year}.csv.sha256")"
          python - "$csv" "$report" "$year" "$raw_sha256" "$normalized_sha256" <<'PY'
          import csv, json, sys
          from collections import Counter
          from datetime import datetime
          from pathlib import Path
          csv_path = Path(sys.argv[1]); report_path = Path(sys.argv[2])
          year = int(sys.argv[3]); raw_sha256 = sys.argv[4]; normalized_sha256 = sys.argv[5]
          with csv_path.open(encoding="utf-8", newline="") as f:
              reader = csv.DictReader(f); rows = list(reader); fieldnames = reader.fieldnames or []
          if not rows: raise SystemExit("NORMALIZED sem registros")
          required = {"data_pregao","codbdi","codneg","tpmerc","nomres","preabe","premax","premin","premed","preult","totneg","quatot","voltot","codisi","dismes"}
          missing = sorted(required - set(fieldnames))
          if missing: raise SystemExit(f"campos ausentes: {missing}")
          dates = [r["data_pregao"] for r in rows if r["data_pregao"]]
          bad_dates = []
          for d in dates:
              try: datetime.strptime(d, "%Y-%m-%d")
              except ValueError: bad_dates.append(d)
          wrong_year = [d for d in dates if not d.startswith(f"{year}-")]
          keys = [(r["data_pregao"],r["codbdi"],r["codneg"],r["tpmerc"],r["dismes"]) for r in rows]
          duplicate_rows = sum(c-1 for c in Counter(keys).values() if c > 1)
          report = {
              "schema_version":"1.0.0","status":"VALIDADO" if not bad_dates and not wrong_year else "REVISAR",
              "ano":year,"parser_version":"1.1.0","source":"B3",
              "raw_file":f"COTAHIST_A{year}.ZIP","raw_sha256":raw_sha256,
              "normalized_file":f"COTAHIST_A{year}.csv","normalized_sha256":normalized_sha256,
              "linhas_normalized":len(rows),"campos":len(fieldnames),
              "primeira_data":min(dates),"ultima_data":max(dates),
              "datas_invalidas":len(bad_dates),"datas_fora_do_ano":len(wrong_year),
              "duplicidades_chave_candidata":duplicate_rows,
              "chave_candidata":["data_pregao","codbdi","codneg","tpmerc","dismes"],
              "evidencia":"NORMALIZED derivado do RAW validado; RAW permanece a fonte primária."
          }
          report_path.write_text(json.dumps(report,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          print(json.dumps(report,indent=2,ensure_ascii=False))
          if bad_dates or wrong_year: raise SystemExit("falha de qualidade de datas")
          PY

      - name: Persistir manifesto e checksum
        shell: bash
        run: |
          set -euo pipefail
          year="$ANO"
          mkdir -p dados/cotahist/normalized/manifests
          cp "/tmp/quality/COTAHIST_A${year}_quality.json" "dados/cotahist/normalized/manifests/COTAHIST_A${year}_quality.json"
          cp "/tmp/quality/COTAHIST_A${year}.csv.sha256" "dados/cotahist/normalized/manifests/COTAHIST_A${year}.csv.sha256"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "dados/cotahist/normalized/manifests/COTAHIST_A${year}_quality.json" "dados/cotahist/normalized/manifests/COTAHIST_A${year}.csv.sha256"
          git commit -m "data(normalized): persistir evidencia COTAHIST ${year}" || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publicar CSV como artefato
        uses: actions/upload-artifact@v4
        with:
          name: cotahist-normalized-${{ matrix.year }}
          path: |
            /tmp/normalized/COTAHIST_A${{ matrix.year }}.csv
            /tmp/quality/COTAHIST_A${{ matrix.year }}_quality.json
            /tmp/quality/COTAHIST_A${{ matrix.year }}.csv.sha256
          if-no-files-found: error
          retention-days: 30
