name: COTAHIST FASE08H - Recorrencia K4 Multianos
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/ingestao/analisar_recurrencia_colisoes_k4_cotahist_multianos_v1.py"
      - "dados/cotahist/raw/anual/COTAHIST_A*.ZIP"
      - ".github/workflows/cotahist-fase08h-recurrencia-k4-multianos-v1.yml"
permissions:
  contents: write
jobs:
  analise:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Executar analise FASE 08H
        run: python scripts/ingestao/analisar_recurrencia_colisoes_k4_cotahist_multianos_v1.py
      - name: Publicar evidencia
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_FASE08H_RECORRENCIA_K4_MULTIANOS_V1.json
          git diff --cached --quiet && exit 0
          git commit -m "data: publicar evidencia FASE 08H recorrencia K4 multianos"
          git pull --rebase origin main
          git push origin HEAD:main
