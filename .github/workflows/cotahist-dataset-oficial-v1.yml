name: COTAHIST - arquivo histórico para consulta V1 (validação manual, sem publicação)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Gerar arquivo histórico em ambiente temporário
        run: python scripts/ingestao/gerar_dataset_oficial_cotahist_v1.py
      - name: Disponibilizar artefacto para revisão
        uses: actions/upload-artifact@v4
        with:
          name: cotahist-arquivo-consulta-v1-validation
          path: dados/cotahist/oficial/COTAHIST_DATASET_OFICIAL_V1.0.json
          retention-days: 7
