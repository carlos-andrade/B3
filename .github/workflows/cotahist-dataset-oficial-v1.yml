name: COTAHIST - dataset oficial V1

on:
  push:
    branches: [main]
    paths:
      - "dados/cotahist/certificacao/**"
      - "dados/cotahist/normalized/manifests/**"
      - "scripts/ingestao/gerar_dataset_oficial_cotahist_v1.py"
      - ".github/workflows/cotahist-dataset-oficial-v1.yml"
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cotahist-dataset-oficial-v1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar Dataset Oficial
        run: python scripts/ingestao/gerar_dataset_oficial_cotahist_v1.py

      - name: Verificar alterações
        id: diff
        run: |
          if git diff --quiet -- dados/cotahist/oficial/COTAHIST_DATASET_OFICIAL_V1.0.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Persistir manifesto
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/oficial/COTAHIST_DATASET_OFICIAL_V1.0.json
          git commit -m "data(oficial): atualiza dataset oficial COTAHIST"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publicar manifesto
        uses: actions/upload-artifact@v4
        with:
          name: cotahist-dataset-oficial-v1
          path: dados/cotahist/oficial/COTAHIST_DATASET_OFICIAL_V1.0.json
          retention-days: 30
