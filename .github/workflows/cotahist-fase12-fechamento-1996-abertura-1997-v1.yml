name: COTAHIST - FASE12 Fechamento 1996 Abertura 1997 V1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cotahist-fase12-fechamento-1996-abertura-1997-v1.yml"
      - "scripts/ingestao/fechar_cotahist_1996_abrir_1997_fase12_v1.py"
      - "dados/cotahist/quality/COTAHIST_1996_FASE11_CERTIFICACAO_V1.json"
      - "dados/cotahist/normalized/manifests/COTAHIST_A1997_quality.json"
      - "dados/cotahist/raw/anual/COTAHIST_A1997.ZIP"
      - "dados/cotahist/normalized/anual/COTAHIST_A1997.csv"
permissions:
  contents: write
concurrency:
  group: cotahist-fase12-1996-1997
  cancel-in-progress: false
jobs:
  transicao:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Executar FASE12
        run: python scripts/ingestao/fechar_cotahist_1996_abrir_1997_fase12_v1.py
      - name: Publicar transicao
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_1996_FASE12_FECHAMENTO_1997_ABERTURA_V1.json
          git diff --cached --quiet || git commit -m "audit(cotahist): publicar fechamento 1996 abertura 1997"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Resumo
        if: always()
        run: echo "FASE12 1996->1997: fechamento e abertura sob controle"
