name: COTAHIST 1986 - Auditoria Quantidade Volume Preco V1\n# V1.1.3 - excluir volume zero compativel do teste de outlier

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/ingestao/auditar_quantidade_volume_preco_cotahist_1986_v1.py"
      - ".github/workflows/cotahist-quantidade-volume-preco-1986-v1.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Auditar quantidade volume preco
        run: |
          python scripts/ingestao/auditar_quantidade_volume_preco_cotahist_1986_v1.py             --zip dados/cotahist/raw/anual/COTAHIST_A1986.ZIP             --output dados/cotahist/quality/COTAHIST_1986_AUDITORIA_QUANTIDADE_VOLUME_PRECO_V1.json
      - name: Persistir resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_1986_AUDITORIA_QUANTIDADE_VOLUME_PRECO_V1.json
          git diff --cached --quiet || git commit -m "data(cotahist): auditoria quantidade volume preco 1986"
          git pull --rebase origin main
          git push
