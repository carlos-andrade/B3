name: COTAHIST - auditoria semantica duplicidades

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "Ano inicial"
        required: true
        default: "1986"
      end_year:
        description: "Ano final"
        required: true
        default: "2026"
  push:
    paths:
      - "scripts/ingestao/audit_duplicate_cotahist.py"
      - ".github/workflows/cotahist-auditoria-duplicidades.yml"

permissions:
  contents: write

concurrency:
  group: cotahist-auditoria-duplicidades
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        year: [1986,1987,1988,1989,1990,1991,1992,1993,1994,1995,1996,1997,1998,1999,2000,2001,2002,2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar RAW COTAHIST
        env:
          YEAR: ${{ matrix.year }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/cotahist
          url="https://bvmf.bmfbovespa.com.br/InstDados/SerHist/COTAHIST_A${YEAR}.ZIP"
          curl --fail --location --silent --show-error --retry 8 --retry-all-errors --retry-delay 10 --connect-timeout 30 --max-time 600 "$url" -o "/tmp/cotahist/COTAHIST_A${YEAR}.ZIP"

      - name: Executar auditoria
        env:
          YEAR: ${{ matrix.year }}
        run: |
          set -euo pipefail
          python3 scripts/ingestao/audit_duplicate_cotahist.py "/tmp/cotahist/COTAHIST_A${YEAR}.ZIP" > "/tmp/COTAHIST_A${YEAR}_duplicate_audit.json"

      - name: Persistir evidência
        env:
          YEAR: ${{ matrix.year }}
        run: |
          set -euo pipefail
          mkdir -p dados/cotahist/normalized/manifests
          cp "/tmp/COTAHIST_A${YEAR}_duplicate_audit.json" "dados/cotahist/normalized/manifests/COTAHIST_A${YEAR}_duplicate_audit.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "dados/cotahist/normalized/manifests/COTAHIST_A${YEAR}_duplicate_audit.json"
          git commit -m "data(ingestao): auditoria semantica duplicidades ${YEAR}" || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: cotahist-duplicate-audit-${{ matrix.year }}
          path: /tmp/COTAHIST_A${{ matrix.year }}_duplicate_audit.json
          retention-days: 90
