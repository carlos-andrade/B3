name: COTAHIST - FASE09 Pre-Release 1995
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cotahist-fase09-prerelease-1995-v1.yml"
      - "dados/cotahist/quality/COTAHIST_1995_FASE03_PARSING_V1.json"
      - "dados/cotahist/quality/COTAHIST_1995_FASE04_NORMALIZACAO_V1.json"
      - "dados/cotahist/quality/COTAHIST_1995_FASE05_MANIFESTO_CHECKSUM_V1.json"
      - "dados/cotahist/quality/COTAHIST_1995_FASE06_SEMANTICA_V1.json"
      - "dados/cotahist/quality/COTAHIST_1995_FASE07_IDENTIDADE_HISTORICA_V1.json"
      - "dados/cotahist/quality/COTAHIST_1995_FASE08_SEMANTICA_K4_V1.json"
      - "dados/cotahist/raw/anual/COTAHIST_A1995.ZIP"
      - "dados/cotahist/normalized/anual/COTAHIST_A1995.csv"
      - "dados/cotahist/normalized/manifests/COTAHIST_A1995_quality.json"
permissions:
  contents: write
concurrency:
  group: cotahist-fase09-1995
  cancel-in-progress: false
jobs:
  prerelease:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Avaliar gate FASE09
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, hashlib, sys
          y="1995"; q=pathlib.Path("dados/cotahist/quality")
          evidence={
            "F03":q/f"COTAHIST_{y}_FASE03_PARSING_V1.json",
            "F04":q/f"COTAHIST_{y}_FASE04_NORMALIZACAO_V1.json",
            "F05":q/f"COTAHIST_{y}_FASE05_MANIFESTO_CHECKSUM_V1.json",
            "F06":q/f"COTAHIST_{y}_FASE06_SEMANTICA_V1.json",
            "F07":q/f"COTAHIST_{y}_FASE07_IDENTIDADE_HISTORICA_V1.json",
            "F08":q/f"COTAHIST_{y}_FASE08_SEMANTICA_K4_V1.json",
          }
          required={
            "RAW":pathlib.Path(f"dados/cotahist/raw/anual/COTAHIST_A{y}.ZIP"),
            "NORMALIZED":pathlib.Path(f"dados/cotahist/normalized/anual/COTAHIST_A{y}.csv"),
            "MANIFEST":pathlib.Path(f"dados/cotahist/normalized/manifests/COTAHIST_A{y}_quality.json"),
          }
          missing=[k for k,p in {**evidence,**required}.items() if not p.exists()]
          statuses={}
          for k,p in evidence.items():
            if p.exists():
              try: statuses[k]=json.loads(p.read_text(encoding="utf-8")).get("status")
              except Exception: statuses[k]="INVALID_JSON"
          blocked=[]
          for k in ["F03","F04","F05","F06","F08"]:
            if statuses.get(k)!="VALIDADO": blocked.append(k)
          if statuses.get("F07") not in ("VALIDADO","FASE_07_IDENTIDADE_HISTORICA_1995_ANALISE"):
            blocked.append("F07")
          raw=required["RAW"]
          raw_sha=hashlib.sha256(raw.read_bytes()).hexdigest() if raw.exists() else None
          expected="de553f41a3ce15ec8a082ed1c2d451df58520a447d3f39417f45e7feb5a995fc"
          if raw_sha and raw_sha!=expected: blocked.append("RAW_SHA256")
          ok=not missing and not blocked
          out={
            "schema_version":"1.0.0","year":1995,"phase":"FASE09",
            "status":"LIBERADO_PARA_FASE10" if ok else "BLOQUEADO",
            "preconditions":{k:("OK" if k not in missing else "AUSENTE") for k in {**evidence,**required}},
            "evidence_statuses":statuses,"missing":missing,"blocked":blocked,
            "raw_sha256":raw_sha,"expected_raw_sha256":expected,
            "f07_treatment":"F07 is accepted as completed analysis because its successful Run #2 evidence has analysis status rather than a terminal VALIDADO label.",
            "decision":"LIBERADO_PARA_FASE10" if ok else "BLOQUEADO",
            "note":"FASE09 consolidates existing evidence; it does not retrocertify missing phases."
          }
          target=q/f"COTAHIST_{y}_FASE09_PRE_RELEASE_V1.json"
          target.write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False))
          if not ok: sys.exit(1)
          PY
      - name: Publicar FASE09
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_1995_FASE09_PRE_RELEASE_V1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit(cotahist): publicar pre-release fase 09 1995"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
