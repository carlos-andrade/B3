name: COTAHIST - dataset oficial V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dados/cotahist/normalized/anual/**"
      - "dados/cotahist/certificacao/v2/**"
      - "dados/cotahist/normalized/manifests/**"
      - "scripts/ingestao/gerar_dataset_oficial_cotahist_v2.py"
      - ".github/workflows/cotahist-dataset-oficial-v2.yml"

permissions:
  contents: write

concurrency:
  group: cotahist-dataset-oficial-v2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar Dataset Oficial V2
        run: python scripts/ingestao/gerar_dataset_oficial_cotahist_v2.py

      - name: Persistir Dataset Oficial V2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/oficial/COTAHIST_DATASET_OFICIAL_V2.0.json
          git diff --cached --quiet || git commit -m "data(oficial): publicar dataset COTAHIST V2"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publicar evidência
        uses: actions/upload-artifact@v4
        with:
          name: cotahist-dataset-oficial-v2
          path: dados/cotahist/oficial/COTAHIST_DATASET_OFICIAL_V2.0.json
          retention-days: 30
