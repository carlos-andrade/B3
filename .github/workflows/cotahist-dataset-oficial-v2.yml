name: COTAHIST - dataset oficial V2 (validação manual, sem publicação)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sem materialização LFS global
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Instalar Git LFS e materializar NORMALIZED anual
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install
          git lfs pull --include="dados/cotahist/normalized/anual/COTAHIST_A*.csv"
      - name: Gerar Dataset Oficial V2 em ambiente temporário
        run: python scripts/ingestao/gerar_dataset_oficial_cotahist_v2.py
      - name: Disponibilizar artefacto para revisão
        uses: actions/upload-artifact@v4
        with:
          name: cotahist-dataset-oficial-v2-validation
          path: dados/cotahist/oficial/COTAHIST_DATASET_OFICIAL_V2.0.json
          retention-days: 7
