name: COTAHIST 2001 - Gate 06-08
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cotahist-gate-06-08-2001-v1.yml"
      - "dados/cotahist/quality/COTAHIST_2001_FASE06_RECONCILIACAO_V1.json"
      - "dados/cotahist/quality/COTAHIST_2001_FASE07_IDENTIDADE_CHAVES_V1.json"
      - "dados/cotahist/quality/COTAHIST_2001_FASE08_SEMANTICA_CALENDARIO_V1.json"
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows/cotahist-gate-06-08-2001-v1.yml
            dados/cotahist/quality/COTAHIST_2001_FASE06_RECONCILIACAO_V1.json
            dados/cotahist/quality/COTAHIST_2001_FASE07_IDENTIDADE_CHAVES_V1.json
            dados/cotahist/quality/COTAHIST_2001_FASE08_SEMANTICA_CALENDARIO_V1.json
            dados/cotahist/quality/COTAHIST_2001_GATE_06_08_V1.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Avaliar evidências
        run: |
          python - <<'PY'
          import json, pathlib, datetime, sys
          root = pathlib.Path("dados/cotahist/quality")
          specs = {
            "FASE06": ("COTAHIST_2001_FASE06_RECONCILIACAO_V1.json", "VALIDADO"),
            "FASE07": ("COTAHIST_2001_FASE07_IDENTIDADE_CHAVES_V1.json", "VALIDADO"),
            "FASE08": ("COTAHIST_2001_FASE08_SEMANTICA_CALENDARIO_V1.json", "VALIDADO_COM_EXCECAO")
          }
          data, blockers = {}, []
          for phase, (name, required) in specs.items():
              p = root / name
              if not p.is_file():
                  blockers.append(f"{phase}: evidência ausente")
              else:
                  data[phase] = json.loads(p.read_text(encoding="utf-8"))
                  if data[phase].get("status") != required:
                      blockers.append(f"{phase}: status inesperado")
          if not blockers:
              if data["FASE06"].get("mismatch_count") != 0:
                  blockers.append("FASE06: divergências encontradas")
              if data["FASE07"].get("candidate_with_prazot", {}).get("duplicate_groups") != 0:
                  blockers.append("FASE07: colisões na chave selecionada")
              ex = data["FASE08"].get("exceptions", [])
              if not ex or any(x.get("blocking") is not False or not x.get("classification") for x in ex):
                  blockers.append("FASE08: exceção sem classificação não bloqueadora")
          ok = not blockers
          out = {
            "schema_version": "1.0.0",
            "year": 2001,
            "gate": "GATE_06_08",
            "status": "GATE_APROVADO" if ok else "BLOQUEADO",
            "decision": "APROVADO_PARA_ANALISE_FASE09" if ok else "BLOQUEADO_PARA_FASE09",
            "phase_statuses": {k: v.get("status", "AUSENTE") for k, v in data.items()},
            "phase07_duplicate_groups_with_selected_key": data.get("FASE07", {}).get("candidate_with_prazot", {}).get("duplicate_groups"),
            "blockers": blockers,
            "phase08_exceptions": data.get("FASE08", {}).get("exceptions", []),
            "validated_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          p = root / "COTAHIST_2001_GATE_06_08_V1.json"
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps(out, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(out, ensure_ascii=False))
          if not ok:
              sys.exit("GATE 06-08 BLOQUEADO")
          PY
      - name: Persistir decisão
        if: always()
        run: |
          if [ ! -s dados/cotahist/quality/COTAHIST_2001_GATE_06_08_V1.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_2001_GATE_06_08_V1.json
          git diff --cached --quiet && exit 0
          git commit -m "audit(cotahist): persistir gate 06-08 2001"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
