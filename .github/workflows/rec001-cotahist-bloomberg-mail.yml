name: B3 — REC-001 COTAHIST x BLOOMBERG_MAIL

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/rec001_cotahist_bloomberg_mail_v1.py'

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Comparação determinística
        run: python scripts/rec001_cotahist_bloomberg_mail_v1.py
      - name: Publicar evidência
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_A2026_REC001_BLOOMBERG_MAIL_V1.json
          git diff --cached --quiet || git commit -m "test(rec001): comparar COTAHIST B3 x BLOOMBERG_MAIL"
          git push
