name: B3 — REC-001 COTAHIST x BLOOMBERG_MAIL

on:
  workflow_dispatch:
  schedule:
    - cron: "40 5 * * *"
  push:
    branches: [main]
    paths:
      - "dados/cotahist/raw/anual/COTAHIST_A2026.ZIP"
      - "scripts/rec001_cotahist_bloomberg_mail_v1.py"
      - ".github/workflows/rec001-cotahist-bloomberg-mail.yml"

permissions:
  contents: write

concurrency:
  group: rec001-cotahist-bloomberg-mail
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Comparação determinística
        run: python scripts/rec001_cotahist_bloomberg_mail_v1.py
      - name: Publicar evidência
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_A2026_REC001_BLOOMBERG_MAIL_V1.json
          if git diff --cached --quiet; then
            echo "Evidência sem alterações; nenhum commit necessário."
            exit 0
          fi
          git commit -m "test(rec001): comparar COTAHIST B3 x BLOOMBERG_MAIL"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Resumo de execução — observabilidade
        if: always()
        run: |
          {
            echo "## Observabilidade"
            echo "- Workflow: rec001-cotahist-bloomberg-mail.yml"
            echo "- Resultado do job: ${{ job.status }}"
            echo "- Publicação restrita a execução de comparação bem-sucedida."
          } >> "$GITHUB_STEP_SUMMARY"
