name: B3 — Reconciliação COTAHIST TPMERC 021 x BVBG.028

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/ingestao/reconciliar_tpmerc021_bvbg028_v1.py"
      - ".github/workflows/cotahist-reconciliacao-tpmerc021-bvbg028-v1.yml"

jobs:
  reconciliar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Executar reconciliação
        run: python scripts/ingestao/reconciliar_tpmerc021_bvbg028_v1.py
      - name: Persistir evidência
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_A2026_TPMERC021_BVBG028_RECONCILIACAO_V1.json
          git commit -m "data(b3): reconciliar TPMERC 021 com BVBG 028" || echo "Sem alterações"
          git pull --rebase origin main
          git push origin HEAD:main
