name: Sincronizar WIKI nativa

on:
  push:
    branches: [main]
    paths:
      - 'WIKI/**'
      - '.github/workflows/sincronizar-wiki.yml'
  schedule:
    - cron: '7/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sincronizar-wiki-nativa
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório principal
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verificar segredo da Wiki
        env:
          WIKI_TOKEN: ${{ secrets.B3_WIKI_TOKEN }}
        run: |
          if [ -z "$WIKI_TOKEN" ]; then
            echo "::error::O segredo B3_WIKI_TOKEN não está configurado."
            exit 1
          fi

      - name: Preparar conteúdo da Wiki
        run: |
          rm -rf /tmp/b3-wiki
          mkdir -p /tmp/b3-wiki
          cp WIKI/README.md /tmp/b3-wiki/Home.md

          cat > /tmp/b3-wiki/_Sidebar.md <<'SIDEBAR'
          ## B3 — A Bolsa do Brasil

          - [[Home]]
          - [[Visão Geral]]
          - [[Estado Atual]]
          - [[Modelo de Governança]]
          - [[Política de Evidências]]
          - [[Arquitetura Geral]]
          - [[Estado da Publicação]]
          SIDEBAR

          cp WIKI/00-INICIO/VISAO_GERAL.md /tmp/b3-wiki/Visão-Geral.md
          cp WIKI/00-INICIO/ESTADO_ATUAL.md /tmp/b3-wiki/Estado-Atual.md
          cp WIKI/01-GOVERNANCA/MODELO_DE_GOVERNANCA.md /tmp/b3-wiki/Modelo-de-Governança.md
          cp WIKI/01-GOVERNANCA/POLITICA_DE_EVIDENCIAS.md /tmp/b3-wiki/Política-de-Evidências.md
          cp WIKI/02-ARQUITETURA/ARQUITETURA_GERAL.md /tmp/b3-wiki/Arquitetura-Geral.md

          {
            echo "# Estado da publicação"
            echo
            echo "- Repositório-fonte: `carlos-andrade/B3`"
            echo "- Branch: `main`"
            echo "- Commit-fonte: `${GITHUB_SHA}`"
            echo "- Publicado em UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "- Fonte de verdade: `WIKI/`"
            echo
            echo "Esta página é gerada automaticamente. Alterações devem ser feitas em `WIKI/`."
          } > /tmp/b3-wiki/Estado-da-Publicação.md

      - name: Publicar no Wiki nativo
        env:
          WIKI_TOKEN: ${{ secrets.B3_WIKI_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          rm -rf /tmp/native-wiki
          git clone "https://x-access-token:${WIKI_TOKEN}@github.com/${REPOSITORY}.wiki.git" /tmp/native-wiki

          find /tmp/b3-wiki -maxdepth 1 -type f -print0 | while IFS= read -r -d '' file; do
            cp "$file" "/tmp/native-wiki/$(basename "$file")"
          done

          cd /tmp/native-wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Home.md _Sidebar.md "Visão-Geral.md" "Estado-Atual.md" "Modelo-de-Governança.md" "Política-de-Evidências.md" "Arquitetura-Geral.md" "Estado-da-Publicação.md"

          if git diff --cached --quiet; then
            echo "Wiki já está sincronizada."
            exit 0
          fi

          git commit -m "docs(wiki): sincroniza documentação do B3"
          git push origin HEAD
      
      - name: Resumo de execução — observabilidade
        if: always()
        run: |
          {
            echo "## Observabilidade"
            echo "- Workflow: sincronizar-wiki.yml"
            echo "- Resultado do job: ${{ job.status }}"
            echo "- GITHUB_STEP_SUMMARY: habilitado"
          } >> "$GITHUB_STEP_SUMMARY"
