name: Capturar dados B3 - Pesquisa por Pregao

on:
  push:
    paths:
      - ".github/workflows/capturar-pesquisa-pregao.yml"
      - "ferramentas/importar_pesquisa_pregao.py"
  workflow_dispatch:
    inputs:
      date:
        description: "Data de referencia YYYY-MM-DD"
        required: true
        default: "2026-09-22"
      arquivo:
        description: "Codigo B3 (vazio = todos os 6 prioritarios)"
        required: false
        default: ""

name: Capturar dados B3 - Pesquisa por Pregao\n\non:\n  workflow_dispatch:\n    inputs:\n      date:\n        description: "Data de referencia YYYY-MM-DD"\n        required: true\n        default: "2026-09-22"\n      arquivo:\n        description: "Codigo B3 (vazio = todos os 6 prioritarios)"\n        required: false\n        default: ""\n\npermissions:\n  contents: write\n\njobs:\n  captura:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n      - name: Python\n        uses: actions/setup-python@v5\n        with:\n          python-version: "3.12"\n      - name: Capturar arquivos\n        env:\n          DATA: ${{ inputs.date }}\n          ARQUIVO: ${{ inputs.arquivo }}\n        run: |\n          set -euo pipefail\n          if [ -n "$ARQUIVO" ]; then\n            python ferramentas/importar_pesquisa_pregao.py --date "$DATA" --arquivo "$ARQUIVO"\n          else\n            python ferramentas/importar_pesquisa_pregao.py --date "$DATA"\n          fi\n      - name: Verificar tamanhos\n        run: |\n          find dados/market_data/raw -type f -printf "%s %p\n" | sort -nr | head -50\n      - name: Commit dos dados\n        run: |\n          set -euo pipefail\n          git config user.name "B3 Data Bot"\n          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"\n          git add dados/market_data/raw dados/market_data/manifests\n          if git diff --cached --quiet; then\n            echo "Nenhum novo dado para commit."\n          else\n            git commit -m "data(b3): captura Pesquisa por Pregao ${{ inputs.date }}"\n            git push\n          fi\n