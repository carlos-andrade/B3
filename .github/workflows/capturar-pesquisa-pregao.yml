name: B3 Pesquisa por Pregão — BLOQUEADO POR TERMOS OFICIAIS

on:
  push:
    paths:
      - ".github/workflows/capturar-pesquisa-pregao.yml"
      - "ferramentas/importar_pesquisa_pregao.py"
      - "docs/governanca/licenciamento/REGISTRO_AUTORIZACOES_ENDPOINTS_B3_2026-10-16.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorization_gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Confirmar bloqueio de conformidade
        run: |
          set -euo pipefail
          python scripts/governanca/validar_autorizacao_endpoint.py --endpoint-id B3_PESQUISA_POR_PREGAO_API --allow-blocked
          {
            echo "## Captura desativada por termos oficiais"
            echo "- Nenhuma chamada HTTP foi executada."
            echo "- A página oficial Pesquisa por Pregão proíbe recolha automatizada."
            echo "- Reativação exige alteração legítima do âmbito de autorização e aprovação documentada; não basta a acessibilidade técnica."
          } >> "$GITHUB_STEP_SUMMARY"
