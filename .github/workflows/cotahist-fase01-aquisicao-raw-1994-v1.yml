name: COTAHIST - auditoria retrospectiva 1994 FASE01 V1

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cotahist-fase01-aquisicao-raw-1994-v1.yml"
      - "dados/cotahist/raw/anual/COTAHIST_A1994.ZIP"
      - "dados/cotahist/manifests/COTAHIST_A1994.json"
      - "dados/cotahist/checksums/COTAHIST_A1994.ZIP.sha256"
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {lfs: true, fetch-depth: 0}
      - name: Validar aquisição histórica
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,sys
          raw=pathlib.Path("dados/cotahist/raw/anual/COTAHIST_A1994.ZIP")
          man=pathlib.Path("dados/cotahist/manifests/COTAHIST_A1994.json")
          chk=pathlib.Path("dados/cotahist/checksums/COTAHIST_A1994.ZIP.sha256")
          req=[raw,man,chk]
          missing=[str(p) for p in req if not p.exists()]
          if missing: sys.exit("FASE01 BLOQUEADA: "+str(missing))
          m=json.loads(man.read_text())
          c=chk.read_text().strip().split()[0]
          if m.get("status")!="VALIDADO" or m.get("sha256")!=c:
              sys.exit("FASE01 BLOQUEADA: manifesto/checksum inconsistentes")
          print("FASE01 1994: aquisição histórica reconciliada; SHA-256",c)
          PY
