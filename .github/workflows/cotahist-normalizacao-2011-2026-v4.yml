# V4 mantida para execucao manual enquanto a falha de inicializacao do runner e investigada.
# Em 2026-09-24, execucoes push encerram como failure sem jobs expostos pela API.
name: COTAHIST - normalizacao historica 2011-2026 V4

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cotahist-normalizacao-historica-v4
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalizar 2011-2026
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/normalized /tmp/quality dados/cotahist/normalized/manifests
          for year in 2011 2012 2013 2014 2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025 2026; do
            zip="dados/cotahist/raw/anual/COTAHIST_A${year}.ZIP"
            csv="/tmp/normalized/COTAHIST_A${year}.csv"
            test -s "$zip"
            python scripts/ingestao/normalize_cotahist.py --zip "$zip" --output "$csv"
            sha256sum "$csv" | awk '{print $1}' > "/tmp/quality/COTAHIST_A${year}.csv.sha256"
          done
      - name: Publicar artefatos leves
        uses: actions/upload-artifact@v4
        with:
          name: cotahist-normalized-2011-2026-v4
          path: |
            /tmp/normalized/*.csv
            /tmp/quality/*.sha256
          retention-days: 7
          if-no-files-found: error
