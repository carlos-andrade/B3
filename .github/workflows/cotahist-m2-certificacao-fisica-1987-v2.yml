name: COTAHIST - M2 certificacao fisica NORMALIZED 1987 V2

on:
  push:
    branches: [main]
    paths:
      - "scripts/ingestao/certificar_cotahist_anual_v2.py"
      - "docs/ingestao/FASE10A_M2_CERTIFICACAO_FISICA_1987_V2.0.md"
      - ".github/workflows/cotahist-m2-certificacao-fisica-1987-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cotahist-m2-certificacao-fisica
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Certificar NORMALIZED físico 1987
        run: python scripts/ingestao/certificar_cotahist_anual_v2.py --year 1987

      - name: Persistir evidência M2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/certificacao/v2/COTAHIST_A1987_CERTIFICACAO_FISICA_V2.0.json
          git diff --cached --quiet || git commit -m "data(certificacao): certificar NORMALIZED fisico A1987 V2"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publicar evidência
        uses: actions/upload-artifact@v4
        with:
          name: cotahist-m2-certificacao-fisica-1987-v2
          path: dados/cotahist/certificacao/v2/COTAHIST_A1987_CERTIFICACAO_FISICA_V2.0.json
          retention-days: 30
