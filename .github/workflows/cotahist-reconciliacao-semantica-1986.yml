name: COTAHIST 1986 - Reconciliação Semântica
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/ingestao/reconciliar_semantica_cotahist_1986.py"
      - ".github/workflows/cotahist-reconciliacao-semantica-1986.yml"
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Reconciliar 1986
        run: |
          set -euo pipefail
          python scripts/ingestao/reconciliar_semantica_cotahist_1986.py --zip dados/cotahist/raw/anual/COTAHIST_A1986.ZIP --output dados/cotahist/quality/COTAHIST_1986_RECONCILIACAO_SEMANTICA_V1.json
      - name: Persistir resultado
        run: |
          set -euo pipefail
          git config user.name "B3 Data Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_1986_RECONCILIACAO_SEMANTICA_V1.json
          if git diff --cached --quiet; then echo "Nenhuma alteração."; else git commit -m "data(cotahist): reconciliação semântica inicial de 1986"; git push; fi
