name: COTAHIST 2002 - FASE06 Reconciliacao Semantica

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cotahist-fase06-reconciliacao-2002-v1.yml"
      - "dados/cotahist/quality/COTAHIST_2002_FASE05_MANIFESTO_CHECKSUM_V1.json"
      - "dados/cotahist/raw/anual/COTAHIST_A2002.ZIP"
      - "dados/cotahist/normalized/anual/COTAHIST_A2002.csv"
      - "dados/cotahist/normalized/manifests/COTAHIST_A2002_quality.json"

permissions:
  contents: write

concurrency:
  group: cotahist-fase06-reconciliacao-2002-v1
  cancel-in-progress: false

jobs:
  reconciliacao:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
          sparse-checkout: |
            .gitattributes
            .github/workflows/cotahist-fase06-reconciliacao-2002-v1.yml
            dados/cotahist/raw/anual/COTAHIST_A2002.ZIP
            dados/cotahist/normalized/anual/COTAHIST_A2002.csv
            dados/cotahist/normalized/manifests/COTAHIST_A2002_quality.json
            dados/cotahist/quality/COTAHIST_2002_FASE05_MANIFESTO_CHECKSUM_V1.json
            dados/cotahist/quality/COTAHIST_2002_FASE06_RECONCILIACAO_V1.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconciliar campos críticos RAW x NORMALIZED
        run: |
          python - <<'PY'
          import csv, datetime, hashlib, json, pathlib, sys, zipfile
          from decimal import Decimal
          root=pathlib.Path(".")
          raw=root/"dados/cotahist/raw/anual/COTAHIST_A2002.ZIP"
          norm=root/"dados/cotahist/normalized/anual/COTAHIST_A2002.csv"
          mp=root/"dados/cotahist/normalized/manifests/COTAHIST_A2002_quality.json"
          f5p=root/"dados/cotahist/quality/COTAHIST_2002_FASE05_MANIFESTO_CHECKSUM_V1.json"
          ev=root/"dados/cotahist/quality/COTAHIST_2002_FASE06_RECONCILIACAO_V1.json"
          for p in (raw,norm,mp,f5p):
              if not p.is_file() or p.stat().st_size==0:
                  sys.exit(f"FASE06 BLOQUEADA: arquivo ausente/vazio: {p}")
          f5=json.loads(f5p.read_text(encoding="utf-8"))
          m=json.loads(mp.read_text(encoding="utf-8"))
          if f5.get("status")!="VALIDADO" or f5.get("decision")!="LIBERADO_PARA_FASE06":
              sys.exit("FASE06 BLOQUEADA: FASE05 não VALIDADO")
          critical=[
            ("data_pregao",3,10,1),("codbdi",11,12,1),("codneg",13,24,1),("tpmerc",25,27,1),
            ("preabe",57,69,100),("premax",70,82,100),("premin",83,95,100),
            ("premed",96,108,100),("preult",109,121,100),("totneg",148,152,1),
            ("quatot",153,170,1),("voltot",171,188,100)
          ]
          def fixed(rec,name,a,b,scale=1):
              s=rec[a-1:b].decode("ascii").strip()
              if not s: return ""
              if name=="data_pregao": return datetime.datetime.strptime(s,"%Y%m%d").date().isoformat()
              if name in {"codbdi","codneg","tpmerc"}: return s
              if name in {"totneg","quatot"}: return str(int(s))
              return str(Decimal(s)/Decimal(scale))
          with zipfile.ZipFile(raw) as z:
              members=[n for n in z.namelist() if not n.endswith("/")]
              if len(members)!=1 or z.testzip() is not None:
                  sys.exit("FASE06 BLOQUEADA: ZIP inválido")
              with z.open(members[0]) as f:
                  lines=[line.rstrip(b"\r\n") for line in f]
          raw_rows=[tuple(fixed(line,name,a,b,scale) for name,a,b,scale in critical) for line in lines if line[:2]==b"01" and len(line)==245]
          with norm.open(encoding="utf-8",newline="") as f:
              rd=csv.DictReader(f); header=rd.fieldnames or []
              required=[x[0] for x in critical]
              if any(k not in header for k in required):
                  sys.exit("FASE06 BLOQUEADA: campos críticos ausentes")
              norm_rows=[tuple(r[k].strip() for k in required) for r in rd]
          mismatches=[]
          if len(raw_rows)!=len(norm_rows):
              mismatches.append({"type":"ROW_COUNT","raw":len(raw_rows),"normalized":len(norm_rows)})
          for i,(a,b) in enumerate(zip(raw_rows,norm_rows),start=1):
              if a!=b:
                  mismatches.append({"row":i,"raw":a,"normalized":b})
                  if len(mismatches)>=20: break
          ok=not mismatches and len(raw_rows)==m.get("linhas_normalized")
          out={
            "schema_version":"1.0.0","year":2002,"phase":"FASE06",
            "status":"VALIDADO" if ok else "BLOQUEADO",
            "decision":"LIBERADO_PARA_FASE07" if ok else "BLOQUEADO_PARA_FASE07",
            "raw_sha256":hashlib.sha256(raw.read_bytes()).hexdigest(),
            "normalized_sha256":hashlib.sha256(norm.read_bytes()).hexdigest(),
            "phase05_status":f5.get("status"),
            "raw_records":len(raw_rows),"normalized_records":len(norm_rows),
            "critical_fields_checked":[x[0] for x in critical],
            "mismatch_count":len(mismatches),"mismatch_sample":mismatches,
            "logical_key_uniqueness_assessment":"DEFERRED_TO_FASE07",
            "raw_immutable":True,"deduplication_performed":False,
            "validated_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          ev.parent.mkdir(parents=True,exist_ok=True)
          ev.write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False))
          if not ok: sys.exit("FASE06 BLOQUEADA: divergências encontradas")
          PY

      - name: Persistir evidência FASE06 inclusive quando bloqueada
        if: always()
        run: |
          set -euo pipefail
          test -s dados/cotahist/quality/COTAHIST_2002_FASE06_RECONCILIACAO_V1.json || {
            echo "Nenhuma evidência FASE06 produzida."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_2002_FASE06_RECONCILIACAO_V1.json
          git diff --cached --quiet && exit 0
          git commit -m "audit(cotahist): persistir resultado fase 06 2002"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            echo "Push concorrente; nova tentativa ${attempt}/5."
            sleep $((attempt * 2))
          done
          echo "Falha de persistência após 5 tentativas."
          exit 1

      - name: Resumo
        if: always()
        run: |
          {
            echo "## COTAHIST 2002 — FASE06"
            echo "- Reconcilia 12 campos críticos sem decidir unicidade de chave."
            echo "- Não deduplica."
            echo "- Resultado: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
