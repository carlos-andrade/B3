name: COTAHIST - normalizacao controlada V7

on:
  workflow_dispatch:
    inputs:
      ano:
        description: "Ano COTAHIST a processar"
        required: true
        default: "1986"
        type: string

permissions:
  contents: write

concurrency:
  group: cotahist-normalizacao-controlada-v7
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar ano
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.ano }}" =~ ^[0-9]{4}$ ]]
          test "${{ inputs.ano }}" -ge 1986
          test "${{ inputs.ano }}" -le 2026

      - name: Normalizar COTAHIST
        shell: bash
        run: |
          set -euo pipefail
          ano="${{ inputs.ano }}"
          zip="dados/cotahist/raw/anual/COTAHIST_A${ano}.ZIP"
          csv="/tmp/normalized/COTAHIST_A${ano}.csv"
          report="/tmp/quality/COTAHIST_A${ano}_quality.json"
          sha="/tmp/quality/COTAHIST_A${ano}.csv.sha256"
          mkdir -p /tmp/normalized /tmp/quality dados/cotahist/normalized/manifests
          test -s "$zip"
          python scripts/ingestao/normalize_cotahist.py --zip "$zip" --output "$csv"
          sha256sum "$csv" | awk '{print $1}' > "$sha"
          raw_sha256="$(sha256sum "$zip" | awk '{print $1}')"
          normalized_sha256="$(cat "$sha")"
          python scripts/ingestao/validar_normalized.py "$csv" "$report" "$ano" "$raw_sha256" "$normalized_sha256"
          cp "$report" "dados/cotahist/normalized/manifests/COTAHIST_A${ano}_quality.json"
          cp "$sha" "dados/cotahist/normalized/manifests/COTAHIST_A${ano}.csv.sha256"

      - name: Persistir evidencia
        shell: bash
        run: |
          set -euo pipefail
          ano="${{ inputs.ano }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "dados/cotahist/normalized/manifests/COTAHIST_A${ano}_quality.json" "dados/cotahist/normalized/manifests/COTAHIST_A${ano}.csv.sha256"
          git commit -m "data(normalized): validar COTAHIST A${ano} V7" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: cotahist-normalizacao-controlada-v7-${{ inputs.ano }}
          path: |
            /tmp/normalized/*.csv
            /tmp/quality/*.json
            /tmp/quality/*.sha256
          retention-days: 30
