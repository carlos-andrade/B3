name: COTAHIST 1987 - Auditoria Calendario V1
on:
  push:
    paths:
      - "dados/cotahist/normalized/anual/COTAHIST_A1987.csv"
      - "scripts/ingestao/auditar_calendario_cotahist_1987_v1.py"
      - ".github/workflows/cotahist-auditoria-calendario-1987-v1.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Executar auditoria
        run: python3 scripts/ingestao/auditar_calendario_cotahist_1987_v1.py
      - name: Publicar evidencia
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_1987_AUDITORIA_CALENDARIO_V1.json
          git diff --cached --quiet || git commit -m "chore(cotahist): publicar evidencia calendario 1987"
          git push
