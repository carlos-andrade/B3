name: Auditoria da chave logica COTAHIST 1988 v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'dados/cotahist/raw/anual/COTAHIST_A1988.ZIP'
      - 'scripts/ingestao/auditar_chave_logica_cotahist_1988_v1.py'
      - '.github/workflows/cotahist-chave-logica-1988-v1.yml'

permissions:
  contents: write
concurrency:
  group: cotahist-1988-chave-logica
  cancel-in-progress: false

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Executar auditoria
        run: python scripts/ingestao/auditar_chave_logica_cotahist_1988_v1.py
      - name: Publicar evidencia
        uses: actions/upload-artifact@v4
        with:
          name: cotahist-chave-logica-1988
          path: dados/cotahist/quality/COTAHIST_1988_AUDITORIA_CHAVE_LOGICA_V1.json
          retention-days: 30
      - name: Commitar evidencia
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_1988_AUDITORIA_CHAVE_LOGICA_V1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: chave logica COTAHIST 1988 v1"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
