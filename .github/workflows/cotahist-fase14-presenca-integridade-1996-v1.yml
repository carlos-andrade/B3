name: COTAHIST 1996 - FASE14 Presenca e Integridade RAW V1

on:
  push:
    branches: [main]
    paths:
      - "dados/cotahist/raw/anual/COTAHIST_A1996.ZIP"
      - "dados/cotahist/manifests/COTAHIST_A1996.json"
      - "dados/cotahist/checksums/COTAHIST_A1996.ZIP.sha256"
      - "scripts/ingestao/validar_presenca_integridade_cotahist_1996_fase14_v1.py"
      - ".github/workflows/cotahist-fase14-presenca-integridade-1996-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cotahist-fase14-1996
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true
      - name: Executar FASE14
        run: python scripts/ingestao/validar_presenca_integridade_cotahist_1996_fase14_v1.py
      - name: Persistir evidencia FASE14
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_1996_FASE14_PRESENCA_INTEGRIDADE_V1.json
          if git diff --cached --quiet; then
            echo "Sem alteracao."
            exit 0
          fi
          git commit -m "audit(cotahist): valida 1996 fase 14 raw"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Resumo
        if: always()
        run: echo "FASE14 1996: presenca e integridade RAW"
