name: COTAHIST - normalizacao 1986-2010 V8

on:
  push:
    paths:
      - ".github/workflows/cotahist-normalizacao-1986-2010-v8.yml"
      - "scripts/ingestao/normalize_cotahist.py"
      - "scripts/ingestao/validar_normalized.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cotahist-normalizacao-1986-2010-v8
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalizar 1986-2010
        run: |
          set -euo pipefail
          mkdir -p /tmp/normalized /tmp/quality dados/cotahist/normalized/manifests
          for year in $(seq 1986 2010); do
            zip="dados/cotahist/raw/anual/COTAHIST_A${year}.ZIP"
            csv="/tmp/normalized/COTAHIST_A${year}.csv"
            report="/tmp/quality/COTAHIST_A${year}_quality.json"
            sha="/tmp/quality/COTAHIST_A${year}.csv.sha256"
            test -s "$zip"
            python scripts/ingestao/normalize_cotahist.py --zip "$zip" --output "$csv"
            sha256sum "$csv" | awk '{print $1}' > "$sha"
            raw_sha256="$(sha256sum "$zip" | awk '{print $1}')"
            normalized_sha256="$(cat "$sha")"
            python scripts/ingestao/validar_normalized.py "$csv" "$report" "${year}" "$raw_sha256" "$normalized_sha256"
            cp "$report" "dados/cotahist/normalized/manifests/COTAHIST_A${year}_quality.json"
            cp "$sha" "dados/cotahist/normalized/manifests/COTAHIST_A${year}.csv.sha256"
          done

      - name: Persistir evidencias
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/normalized/manifests/
          git commit -m "data(normalized): validar COTAHIST 1986-2010" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: cotahist-normalized-1986-2010-v8
          path: |
            /tmp/normalized/*.csv
            /tmp/quality/*.json
            /tmp/quality/*.sha256
          retention-days: 30
