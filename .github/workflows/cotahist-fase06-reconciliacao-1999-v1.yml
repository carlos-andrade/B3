name: COTAHIST - auditoria retrospectiva 1999 FASE06 V1

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cotahist-fase06-reconciliacao-1999-v1.yml"
      - "dados/cotahist/raw/anual/COTAHIST_A1999.ZIP"
      - "dados/cotahist/normalized/anual/COTAHIST_A1999.csv"
      - "dados/cotahist/normalized/manifests/COTAHIST_A1999_quality.json"
      - "dados/cotahist/quality/COTAHIST_1999_FASE05_MANIFESTO_CHECKSUM_V1.json"

permissions:
  contents: write

jobs:
  reconciliacao:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Reconciliar RAW e normalizado
        run: |
          python - <<'PY'
          import csv, datetime, hashlib, json, pathlib, sys, zipfile
          from decimal import Decimal

          root = pathlib.Path(".")
          raw = root / "dados/cotahist/raw/anual/COTAHIST_A1999.ZIP"
          norm = root / "dados/cotahist/normalized/anual/COTAHIST_A1999.csv"
          manifest = root / "dados/cotahist/normalized/manifests/COTAHIST_A1999_quality.json"
          ev = root / "dados/cotahist/quality/COTAHIST_1999_FASE06_RECONCILIACAO_V1.json"

          for p in (raw, norm, manifest):
              if not p.exists():
                  sys.exit(f"FASE06 BLOQUEADA: ausente {p}")

          m = json.loads(manifest.read_text(encoding="utf-8"))
          if m.get("status") not in {"VALIDADO", "VALIDADO_COM_EXCECAO"}:
              sys.exit(f"FASE06 BLOQUEADA: manifesto normalizado status={m.get('status')!r}")

          critical = [
            ("data_pregao", 3, 10, 1),
            ("codbdi", 11, 12, 1),
            ("codneg", 13, 24, 1),
            ("tpmerc", 25, 27, 1),
            ("preabe", 57, 69, 100),
            ("premax", 70, 82, 100),
            ("premin", 83, 95, 100),
            ("premed", 96, 108, 100),
            ("preult", 109, 121, 100),
            ("totneg", 148, 152, 1),
            ("quatot", 153, 170, 1),
            ("voltot", 171, 188, 100),
          ]

          def fixed(rec, a, b, scale=1):
              s = rec[a-1:b].decode("ascii").strip()
              if not s:
                  return ""
              return str(Decimal(s) / Decimal(scale))

          with zipfile.ZipFile(raw) as z:
              members = z.namelist()
              if len(members) != 1:
                  sys.exit("FASE06 BLOQUEADA: ZIP não possui exatamente um membro")
              data = z.read(members[0])

          raw_rows = []
          for line in data.splitlines():
              if len(line) == 245 and line[0:2] == b"01":
                  raw_rows.append(tuple(fixed(line, a, b, scale) for _, a, b, scale in critical))

          with norm.open("r", encoding="utf-8", newline="") as fh:
              rd = csv.DictReader(fh)
              aliases = {"preabe": "preabe", "preult": "preult"}
              required = [x[0] for x in critical]
              missing = [k for k in required if k not in (rd.fieldnames or [])]
              if missing:
                  sys.exit(f"FASE06 BLOQUEADA: campos ausentes no normalizado: {missing}")
              norm_rows = [tuple(str(r[k]).strip() for k in required) for r in rd]

          if len(raw_rows) != len(norm_rows):
              sys.exit(f"FASE06 BLOQUEADA: contagens divergentes RAW={len(raw_rows)} NORMALIZED={len(norm_rows)}")

          mismatches = []
          for i, (a, b) in enumerate(zip(raw_rows, norm_rows), 1):
              if a != b:
                  mismatches.append({"row": i, "raw": a, "normalized": b})
              if len(mismatches) >= 20:
                  break

          out = {
            "schema_version": "1.0.0",
            "year": 1999,
            "phase": "FASE06",
            "status": "VALIDADO" if not mismatches else "BLOQUEADO",
            "decision": "VALIDADO" if not mismatches else "BLOQUEADO",
            "raw_sha256": hashlib.sha256(raw.read_bytes()).hexdigest(),
            "normalized_sha256": hashlib.sha256(norm.read_bytes()).hexdigest(),
            "raw_records": len(raw_rows),
            "normalized_records": len(norm_rows),
            "critical_fields_checked": [x[0] for x in critical],
            "normalized_header_aliases": aliases,
            "mismatch_count": len(mismatches),
            "mismatch_sample": mismatches,
            "validated_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "governance": {
              "raw_immutable": True,
              "deduplication_performed": False,
              "identity_decision": "RESERVADO_PARA_FASE07"
            }
          }

          ev.parent.mkdir(parents=True, exist_ok=True)
          ev.write_text(json.dumps(out, ensure_ascii=False, indent=2) + "\n")

          if mismatches:
              sys.exit("FASE06 BLOQUEADA: divergências encontradas")

          print("FASE06 1999: VALIDADO")
          print(f"RAW records: {len(raw_rows)}")
          print(f"NORMALIZED records: {len(norm_rows)}")
          print("mismatch_count: 0")
          PY

      - name: Publicar evidência FASE06
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_1999_FASE06_RECONCILIACAO_V1.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração na evidência."
            exit 0
          fi
          git commit -m "audit(cotahist): validar 1999 fase 06 reconciliacao"
          git pull --rebase origin main
          git push origin HEAD:main
