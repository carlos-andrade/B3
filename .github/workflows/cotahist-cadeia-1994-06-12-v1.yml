name: COTAHIST 1994 - cadeia FASE06-12 V2

# DISPARO AUDITAVEL 2026-09-30: replica controlada do gatilho push; RUN_ID e gerado pelo GitHub Actions.
# FASE13 2026-10-01: revalidacao da cadeia 1994 FASE06->FASE12 apos correcao da FASE02.
# FASE13.1 2026-10-01: execucao ordenada e gates explicitos entre blocos.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cotahist-cadeia-1994-06-12-v1.yml"
      - "scripts/ingestao/gerar_evidencias_cotahist_1994_fases06_08_v1.py"
      - "scripts/ingestao/gerar_cadeia_cotahist_1994_fases09_12_v1.py"
      - "dados/cotahist/raw/anual/COTAHIST_A1994.ZIP"
      - "dados/cotahist/normalized/anual/COTAHIST_A1994.csv"
      - "dados/cotahist/normalized/manifests/COTAHIST_A1994_quality.json"
      - "dados/cotahist/quality/COTAHIST_1994_FASE05_MANIFESTO_CHECKSUM_V1.json"
      - "docs/cotahist/MODELO_CERTIFICACAO_ANUAL_COTAHIST_V1.md"
      - "docs/cotahist/COMPARATIVO_BASELINE_1993_VS_1994_FASE06_V1.md"

permissions:
  contents: write

concurrency:
  group: cotahist-cadeia-1994-06-12
  cancel-in-progress: false

jobs:
  cadeia:
    name: "1994 — FASE06→FASE12"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: RUN_START
        run: |
          echo "COTAHIST_CHAIN_RUN_START"
          echo "year=1994"
          echo "chain=FASE06->FASE07->FASE08->FASE09->FASE10->FASE11->FASE12"
          echo "trigger=${{ github.event_name }}"
          echo "sha=${{ github.sha }}"
          date -u +"utc=%Y-%m-%dT%H:%M:%SZ"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Ordem obrigatoria: FASE06 -> FASE07 -> FASE08 -> GATE -> FASE09 -> FASE10 -> FASE11 -> FASE12.
      # O bloco FASE06-08 gera as tres evidencias de forma deterministica; o gate abaixo
      # impede que FASE09-12 seja executada com qualquer dependencia anterior bloqueada.
      - name: FASE06-08 — evidências retrospectivas em ordem
        run: python scripts/ingestao/gerar_evidencias_cotahist_1994_fases06_08_v1.py

      - name: GATE — FASE06-08 antes de FASE09
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path("dados/cotahist/quality")
          expected={
            "FASE06":"COTAHIST_1994_FASE06_RECONCILIACAO_V1.json",
            "FASE07":"COTAHIST_1994_FASE07_IDENTIDADE_CHAVES_V1.json",
            "FASE08":"COTAHIST_1994_FASE08_SEMANTICA_CALENDARIO_V1.json",
          }
          allowed={"VALIDADO","VALIDADO_COM_EXCECAO"}
          for phase, filename in expected.items():
              p=base/filename
              if not p.exists():
                  raise SystemExit(f"GATE_BLOQUEADO: {phase}: evidencia ausente: {p}")
              obj=json.loads(p.read_text(encoding="utf-8"))
              status=obj.get("status")
              print(f"{phase}={status}")
              if status not in allowed:
                  raise SystemExit(f"GATE_BLOQUEADO: {phase}={status}")
          print("GATE_OK: FASE06-08 -> FASE09")
          PY

      - name: FASE09-12 — execução sequencial fail-closed
        run: python scripts/ingestao/gerar_cadeia_cotahist_1994_fases09_12_v1.py

      - name: Publicar evidências 1994
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in \
            dados/cotahist/quality/COTAHIST_1994_FASE06_RECONCILIACAO_V1.json \
            dados/cotahist/quality/COTAHIST_1994_FASE07_IDENTIDADE_CHAVES_V1.json \
            dados/cotahist/quality/COTAHIST_1994_FASE08_SEMANTICA_CALENDARIO_V1.json \
            dados/cotahist/quality/COTAHIST_1994_FASE09_PRE_RELEASE_V1.json \
            dados/cotahist/quality/COTAHIST_1994_FASE10_INTEGRIDADE_V1.json \
            dados/cotahist/quality/COTAHIST_1994_FASE11_CERTIFICACAO_V1.json \
            dados/cotahist/quality/COTAHIST_1994_FASE12_FECHAMENTO_TRANSICAO_V1.json
          do
            if [ -f "$f" ]; then
              git add "$f"
            else
              echo "EVIDENCIA_AUSENTE_IGNORADA: $f"
            fi
          done
          if git diff --cached --quiet; then
            echo "Nenhuma evidência nova."
            exit 0
          fi
          git commit -m "audit(cotahist): cadeia 1994 fases 06-12"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1

      - name: Publicar artefato da cadeia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cotahist-1994-cadeia-fases06-12
          path: dados/cotahist/quality/COTAHIST_1994_FASE*.json
          retention-days: 30
