name: COTAHIST 1994 - cadeia FASE06-12 V2

# DISPARO AUDITAVEL 2026-09-30: replica controlada do gatilho push; RUN_ID e gerado pelo GitHub Actions.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cotahist-cadeia-1994-06-12-v1.yml"
      - "scripts/ingestao/gerar_evidencias_cotahist_1994_fases06_08_v1.py"
      - "scripts/ingestao/gerar_cadeia_cotahist_1994_fases09_12_v1.py"
      - "dados/cotahist/raw/anual/COTAHIST_A1994.ZIP"
      - "dados/cotahist/normalized/anual/COTAHIST_A1994.csv"
      - "dados/cotahist/normalized/manifests/COTAHIST_A1994_quality.json"
      - "dados/cotahist/quality/COTAHIST_1994_FASE05_MANIFESTO_CHECKSUM_V1.json"

permissions:
  contents: write

concurrency:
  group: cotahist-cadeia-1994-06-12
  cancel-in-progress: false

jobs:
  cadeia:
    name: "1994 — FASE06→FASE12"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: RUN_START
        run: |
          echo "COTAHIST_CHAIN_RUN_START"
          echo "year=1994"
          echo "chain=FASE06->FASE07->FASE08->FASE09->FASE10->FASE11->FASE12"
          echo "trigger=${{ github.event_name }}"
          echo "sha=${{ github.sha }}"
          date -u +"utc=%Y-%m-%dT%H:%M:%SZ"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: FASE06-08 — evidências retrospectivas
        run: python scripts/ingestao/gerar_evidencias_cotahist_1994_fases06_08_v1.py

      - name: FASE09-12 — pre-release, integridade, certificação e fechamento
        run: python scripts/ingestao/gerar_cadeia_cotahist_1994_fases09_12_v1.py

      - name: Publicar evidências 1994
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in \
            dados/cotahist/quality/COTAHIST_1994_FASE06_RECONCILIACAO_V1.json \
            dados/cotahist/quality/COTAHIST_1994_FASE07_IDENTIDADE_CHAVES_V1.json \
            dados/cotahist/quality/COTAHIST_1994_FASE08_SEMANTICA_CALENDARIO_V1.json \
            dados/cotahist/quality/COTAHIST_1994_FASE09_PRE_RELEASE_V1.json \
            dados/cotahist/quality/COTAHIST_1994_FASE10_INTEGRIDADE_V1.json \
            dados/cotahist/quality/COTAHIST_1994_FASE11_CERTIFICACAO_V1.json \
            dados/cotahist/quality/COTAHIST_1994_FASE12_FECHAMENTO_TRANSICAO_V1.json
          do
            if [ -f "$f" ]; then
              git add "$f"
            else
              echo "EVIDENCIA_AUSENTE_IGNORADA: $f"
            fi
          done
          if git diff --cached --quiet; then
            echo "Nenhuma evidência nova."
            exit 0
          fi
          git commit -m "audit(cotahist): cadeia 1994 fases 06-12"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1

      - name: Publicar artefato da cadeia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cotahist-1994-cadeia-fases06-12
          path: dados/cotahist/quality/COTAHIST_1994_FASE*.json
          retention-days: 30
