name: COTAHIST - normalizacao historica 2011-2026

# Legado: execucao somente manual ate a consolidacao do pipeline V4/V6.
on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "Primeiro ano a normalizar"
        required: true
        default: "2011"
      end_year:
        description: "Ultimo ano a normalizar"
        required: true
        default: "2026"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        year: [2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalizar COTAHIST
        shell: bash
        run: |
          set -euo pipefail
          year="${{ matrix.year }}"
          zip="dados/cotahist/raw/anual/COTAHIST_A${year}.ZIP"
          test -s "$zip"
          mkdir -p /tmp/normalized
          python scripts/ingestao/normalize_cotahist.py --zip "$zip" --output "/tmp/normalized/COTAHIST_A${year}.csv"

      - name: Publicar CSV
        uses: actions/upload-artifact@v4
        with:
          name: cotahist-normalized-${{ matrix.year }}
          path: /tmp/normalized/COTAHIST_A${{ matrix.year }}.csv
          if-no-files-found: error
          retention-days: 7
