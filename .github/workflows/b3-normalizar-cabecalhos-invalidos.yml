name: B3 - Normalização controlada de cabeçalhos documentais

on:
  push:
    branches: [main]
    paths:
      - "scripts/governanca/normalizar_cabecalhos_invalidos.py"
      - ".github/workflows/b3-normalizar-cabecalhos-invalidos.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b3-normalizacao-cabecalhos
  cancel-in-progress: false

jobs:
  normalizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Normalizar cabeçalhos e recalcular hashes canónicos
        run: python scripts/governanca/normalizar_cabecalhos_invalidos.py

      - name: Publicar lote documental único
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*.md'
          if git diff --cached --quiet; then
            echo "Nenhuma alteração documental pendente."
          else
            git commit -m "docs(b3): normalizar cabeçalhos e hashes canónicos em lote"
            git push origin HEAD:main
          fi
