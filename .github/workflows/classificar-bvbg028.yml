name: Classificar BVBG.028.02

on:
  workflow_dispatch:
  push:
    paths:
      - "ferramentas/classificar_inventario_bvbg028.py"

jobs:
  classificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Classificar inventário
        run: python ferramentas/classificar_inventario_bvbg028.py
      - name: Commit classificação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ativos/catalogo/classificacao/
          git commit -m "data(b3): gerar classificacao estrutural BVBG028" || echo "Sem alterações"
          git push
