name: Classificar BVBG.028.02

on:
  workflow_dispatch:
  push:
    paths:
      - "ferramentas/classificar_inventario_bvbg028.py"
      - ".github/workflows/classificar-bvbg028.yml"

jobs:
  classificar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Classificar inventário
        run: python ferramentas/classificar_inventario_bvbg028.py
      - name: Commit classificação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ativos/catalogo/classificacao/
          git commit -m "data(b3): gerar classificacao estrutural BVBG028" || echo "Sem alterações"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Resumo de execução — observabilidade
        if: always()
        run: |
          {
            echo "## Observabilidade"
            echo "- Workflow: classificar-bvbg028.yml"
            echo "- Resultado do job: ${{ job.status }}"
            echo "- GITHUB_STEP_SUMMARY: habilitado"
          } >> "$GITHUB_STEP_SUMMARY"
