name: COTAHIST - reconciliacao calendario V1

on:
  push:
    paths:
      - "scripts/ingestao/reconciliar_calendario_cotahist_v1.py"
      - "dados/cotahist/raw/anual/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cotahist-reconciliacao-calendario-v1
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconciliar gaps com calendario
        run: |
          python scripts/ingestao/reconciliar_calendario_cotahist_v1.py             --raw-dir dados/cotahist/raw/anual             --output dados/cotahist/quality/COTAHIST_1986_2026_calendario_v1.json

      - name: Persistir evidencia
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_1986_2026_calendario_v1.json
          git commit -m "data(quality): publicar reconciliacao calendario COTAHIST V1" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: cotahist-calendario-1986-2026-v1
          path: dados/cotahist/quality/COTAHIST_1986_2026_calendario_v1.json
          retention-days: 90
