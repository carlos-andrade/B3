name: COTAHIST - certificação anual (validação manual, sem publicação)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Gerar matriz histórica em ambiente temporário
        run: python scripts/ingestao/certificar_cotahist_anual_v1.py
      - name: Disponibilizar artefacto para revisão
        uses: actions/upload-artifact@v4
        with:
          name: cotahist-certificacao-anual-v1-validation
          path: dados/cotahist/certificacao/COTAHIST_CERTIFICACAO_ANUAL_1986_2026_V1.0.csv
          retention-days: 7
