name: COTAHIST - certificacao anual automatica V1

on:
  push:
    branches: [main]
    paths:
      - "dados/cotahist/raw/anual/**"
      - "dados/cotahist/normalized/manifests/**"
      - "scripts/ingestao/certificar_cotahist_anual_v1.py"
      - ".github/workflows/cotahist-certificacao-anual-v1.yml"
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cotahist-certificacao-anual-v1
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar matriz oficial
        run: python scripts/ingestao/certificar_cotahist_anual_v1.py

      - name: Verificar estado Git
        id: diff
        run: |
          if git diff --quiet -- dados/cotahist/certificacao/COTAHIST_CERTIFICACAO_ANUAL_1986_2026_V1.0.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Persistir matriz
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/certificacao/COTAHIST_CERTIFICACAO_ANUAL_1986_2026_V1.0.csv
          git commit -m "data(certificacao): atualiza matriz anual COTAHIST"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publicar matriz
        uses: actions/upload-artifact@v4
        with:
          name: cotahist-certificacao-anual-v1
          path: dados/cotahist/certificacao/COTAHIST_CERTIFICACAO_ANUAL_1986_2026_V1.0.csv
          retention-days: 30
