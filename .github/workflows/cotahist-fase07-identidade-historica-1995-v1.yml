name: COTAHIST 1995 - FASE 07 Identidade Histórica
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/ingestao/analisar_identidade_historica_cotahist_1995_v1.py"
      - ".github/workflows/cotahist-fase07-identidade-historica-1995-v1.yml"
permissions:
  contents: write
jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Executar FASE 07
        run: |
          set -euo pipefail
          python scripts/ingestao/analisar_identidade_historica_cotahist_1995_v1.py             --zip dados/cotahist/raw/anual/COTAHIST_A1995.ZIP             --output dados/cotahist/quality/COTAHIST_1995_FASE07_IDENTIDADE_HISTORICA_V1.json
      - name: Persistir evidência
        run: |
          set -euo pipefail
          git config user.name "B3 Data Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_1995_FASE07_IDENTIDADE_HISTORICA_V1.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração."
          else
            git commit -m "audit(cotahist): executar fase 07 identidade historica 1995"
            git push
          fi
