name: COTAHIST 1998 - FASE07 Identidade Historica V1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/ingestao/analisar_identidade_historica_cotahist_1998_v1.py"
      - ".github/workflows/cotahist-fase07-identidade-historica-1998-v1.yml"
      - "dados/cotahist/quality/COTAHIST_1998_FASE06C_SEMANTICA_TERM_V1.json"
permissions:
  contents: write
concurrency:
  group: cotahist-fase07-1998
  cancel-in-progress: false
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verificar gates anteriores
        run: |
          python - <<'PY'
          import json
          p="dados/cotahist/quality/COTAHIST_1998_FASE06C_SEMANTICA_TERM_V1.json"
          e=json.load(open(p,encoding="utf-8"))
          if e.get("status")!="VALIDADO":
              raise SystemExit("FAIL-CLOSED: FASE06C nao validada")
          if e.get("decision")!="OHLC_CLASSICO_NAO_E_BLOQUEADOR_UNIVERSAL_PARA_TPMERC_030":
              raise SystemExit("FAIL-CLOSED: decisao FASE06C inesperada")
          PY
      - name: Executar FASE07
        run: |
          python scripts/ingestao/analisar_identidade_historica_cotahist_1998_v1.py --zip dados/cotahist/raw/anual/COTAHIST_A1998.ZIP --output dados/cotahist/quality/COTAHIST_1998_FASE07_IDENTIDADE_HISTORICA_V1.json
      - name: Validar evidencia
        run: |
          python - <<'PY'
          import json
          p="dados/cotahist/quality/COTAHIST_1998_FASE07_IDENTIDADE_HISTORICA_V1.json"
          e=json.load(open(p,encoding="utf-8"))
          if e.get("rows",0)<=0: raise SystemExit("FAIL: nenhuma linha analisada")
          for k,v in e["key_metrics"].items():
              if v["rows"] != e["rows"]: raise SystemExit(f"FAIL: cardinalidade inconsistente em {k}")
          PY
      - name: Persistir evidencia
        if: success()
        run: |
          git config user.name "B3 Data Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_1998_FASE07_IDENTIDADE_HISTORICA_V1.json
          git diff --cached --quiet || git commit -m "audit(cotahist): executar fase 07 identidade historica 1998"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
