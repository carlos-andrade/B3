# FASE09 consolida evidências persistidas; não retrocertifica fases anteriores.
name: COTAHIST 2021 - FASE09 Pre-Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dados/cotahist/quality/COTAHIST_2021_GATE_06_08_V1.json"

permissions:
  contents: write

concurrency:
  group: cotahist-fase09-prerelease-2021-v1
  cancel-in-progress: false

jobs:
  prerelease:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
          sparse-checkout: |
            .gitattributes
            .github/workflows/cotahist-fase09-prerelease-2021-v1.yml
            dados/cotahist/raw/anual/COTAHIST_A2021.ZIP
            dados/cotahist/normalized/anual/COTAHIST_A2021.csv
            dados/cotahist/normalized/manifests/COTAHIST_A2021_quality.json
            dados/cotahist/quality/COTAHIST_2021_GATE_06_08_V1.json
            dados/cotahist/quality/COTAHIST_2021_FASE03_PARSING_V1.json
            dados/cotahist/quality/COTAHIST_2021_FASE04_NORMALIZACAO_V1.json
            dados/cotahist/quality/COTAHIST_2021_FASE05_MANIFESTO_CHECKSUM_V1.json
            dados/cotahist/quality/COTAHIST_2021_FASE06_RECONCILIACAO_V1.json
            dados/cotahist/quality/COTAHIST_2021_FASE07_IDENTIDADE_CHAVES_V1.json
            dados/cotahist/quality/COTAHIST_2021_FASE08_SEMANTICA_CALENDARIO_V1.json
            dados/cotahist/quality/COTAHIST_2021_FASE09_PRE_RELEASE_V1.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Avaliar pre-release sem retrocertificacao
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, sys, datetime
          q = pathlib.Path("dados/cotahist/quality")
          names = {
            "FASE03": "COTAHIST_2021_FASE03_PARSING_V1.json",
            "FASE04": "COTAHIST_2021_FASE04_NORMALIZACAO_V1.json",
            "FASE05": "COTAHIST_2021_FASE05_MANIFESTO_CHECKSUM_V1.json",
            "FASE06": "COTAHIST_2021_FASE06_RECONCILIACAO_V1.json",
            "FASE07": "COTAHIST_2021_FASE07_IDENTIDADE_CHAVES_V1.json",
            "FASE08": "COTAHIST_2021_FASE08_SEMANTICA_CALENDARIO_V1.json",
            "GATE_06_08": "COTAHIST_2021_GATE_06_08_V1.json"
          }
          required = {
            "RAW": pathlib.Path("dados/cotahist/raw/anual/COTAHIST_A2021.ZIP"),
            "NORMALIZED": pathlib.Path("dados/cotahist/normalized/anual/COTAHIST_A2021.csv"),
            "MANIFEST": pathlib.Path("dados/cotahist/normalized/manifests/COTAHIST_A2021_quality.json")
          }
          missing = [k for k,p in {**{k:q/v for k,v in names.items()}, **required}.items() if not p.is_file() or p.stat().st_size == 0]
          data = {k: json.loads((q/name).read_text(encoding="utf-8")) for k,name in names.items() if (q/name).is_file() and (q/name).stat().st_size}
          blocked = []
          for phase in ("FASE03","FASE04","FASE05","FASE06","FASE07"):
              if data.get(phase, {}).get("status") != "VALIDADO":
                  blocked.append(f"{phase}_STATUS")
          if data.get("FASE06", {}).get("mismatch_count") != 0:
              blocked.append("FASE06_MISMATCH")
          if data.get("FASE08", {}).get("status") not in {"VALIDADO","VALIDADO_COM_EXCECAO"}:
              blocked.append("FASE08_STATUS")
          if any(e.get("blocking") is not False for e in data.get("FASE08", {}).get("exceptions", [])):
              blocked.append("FASE08_UNCLASSIFIED_EXCEPTION")
          gate = data.get("GATE_06_08", {})
          gate_status_ok = gate.get("status") in {"GATE_APROVADO", "VALIDADO_COM_EXCECAO"}
          gate_decision_ok = gate.get("decision") in {"APROVADO_PARA_ANALISE_FASE09", "LIBERADO_PARA_FASE09"}
          if not gate_status_ok or not gate_decision_ok: blocked.append("GATE_06_08")
          if gate.get("blockers") != []: blocked.append("GATE_HAS_BLOCKERS")
          raw = required["RAW"]
          manifest_path = required["MANIFEST"]
          raw_sha = hashlib.sha256(raw.read_bytes()).hexdigest() if raw.exists() else None
          manifest = json.loads(manifest_path.read_text(encoding="utf-8")) if manifest_path.exists() else {}
          if raw_sha != manifest.get("raw_sha256"): blocked.append("RAW_SHA256")
          csv_path = required["NORMALIZED"]
          csv_sha = hashlib.sha256(csv_path.read_bytes()).hexdigest() if csv_path.exists() else None
          if csv_sha != manifest.get("normalized_sha256"): blocked.append("NORMALIZED_SHA256")
          if csv_sha != gate.get("normalized_sha256_calculated"): blocked.append("GATE_NORMALIZED_SHA256")
          if gate.get("rows_checked") != manifest.get("linhas_normalized"): blocked.append("GATE_ROW_COUNT")
          if gate.get("field_count") != manifest.get("campos"): blocked.append("GATE_FIELD_COUNT")
          ok = not missing and not blocked
          out = {
            "schema_version":"1.0.0", "year":2021, "phase":"FASE09",
            "status":"LIBERADO_PARA_FASE10" if ok else "BLOQUEADO",
            "decision":"LIBERADO_PARA_FASE10" if ok else "BLOQUEADO",
            "preconditions":{k:("OK" if k not in missing else "AUSENTE") for k in {**names,**required}},
            "evidence_statuses":{k:v.get("status") for k,v in data.items()},
            "gate_06_08_status":gate.get("status"), "gate_06_08_decision":gate.get("decision"),
            "gate_status_accepted":gate_status_ok, "gate_decision_accepted":gate_decision_ok,
            "raw_sha256":raw_sha, "normalized_sha256":csv_sha, "missing":missing, "blocked":blocked,
            "phase08_exceptions":data.get("FASE08",{}).get("exceptions",[]),
            "note":"FASE09 consolida evidências persistidas; não substitui nem retrocertifica FASE00–08 e não executa FASE10.",
            "validated_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          target=q/"COTAHIST_2021_FASE09_PRE_RELEASE_V1.json"
          target.write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          if not ok: sys.exit("FASE09 BLOQUEADA")
          PY

      - name: Persistir evidencia FASE09
        if: always()
        run: |
          set -euo pipefail
          test -s dados/cotahist/quality/COTAHIST_2021_FASE09_PRE_RELEASE_V1.json || { echo "Nenhuma evidência FASE09 produzida."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_2021_FASE09_PRE_RELEASE_V1.json
          git diff --cached --quiet && exit 0
          git commit -m "audit(cotahist): registrar pre-release fase 09 2021"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            echo "Push concorrente; nova tentativa ${attempt}/5."
            sleep $((attempt * 2))
          done
          echo "Falha de persistência após 5 tentativas."
          exit 1

      - name: Resumo operacional
        if: always()
        run: |
          {
            echo "## COTAHIST 2021 — FASE09"
            echo "- Consolida evidências anteriores e gate sem retrocertificação."
            echo "- Não executa a validação independente FASE10."
            echo "- Resultado do job: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
