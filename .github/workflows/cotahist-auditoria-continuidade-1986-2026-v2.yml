name: COTAHIST - auditoria continuidade 1986-2026 V2

on:
  push:
    paths:
      - ".github/workflows/cotahist-auditoria-continuidade-1986-2026-v2.yml"
      - "scripts/ingestao/auditar_continuidade_cotahist_v2.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cotahist-auditoria-continuidade-1986-2026-v2
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Auditar COTAHIST 1986-2026 V2
        run: |
          set -euo pipefail
          mkdir -p dados/cotahist/quality
          python scripts/ingestao/auditar_continuidade_cotahist_v2.py --raw-dir dados/cotahist/raw/anual --output dados/cotahist/quality/COTAHIST_1986_2026_continuidade_v2.json
      - name: Publicar evidencia no repositorio
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          python -c 'import json; p="dados/cotahist/quality/COTAHIST_1986_2026_continuidade_v2.json"; o=json.load(open(p,encoding="utf-8")); s={k:o[k] for k in o if k!="por_ano"}; s["resumo_por_ano"]=[{k:r[k] for k in ("ano","linhas_comprimento_diferente_245","linhas_nao_tipo_01","datas_unicas","primeira_data","ultima_data","candidatos_intervalo_longo_total","duplicidade_registro_exato_grupos","duplicidade_registro_exato_excesso_linhas","duplicidade_identidade_instrumento_grupos","duplicidade_identidade_instrumento_excesso_linhas","inconsistencias_ohlc")} for r in o["por_ano"]]; json.dump(s,open("dados/cotahist/quality/COTAHIST_1986_2026_continuidade_v2_resumo.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)' 
          git add dados/cotahist/quality/COTAHIST_1986_2026_continuidade_v2.json dados/cotahist/quality/COTAHIST_1986_2026_continuidade_v2_resumo.json
          git commit -m "data(quality): publicar auditoria COTAHIST 1986-2026 V2" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publicar evidencia como artefato
        uses: actions/upload-artifact@v4
        with:
          name: cotahist-quality-1986-2026-v2
          path: dados/cotahist/quality/COTAHIST_1986_2026_continuidade_v2.json
          retention-days: 90

# trigger V2 audit execution
