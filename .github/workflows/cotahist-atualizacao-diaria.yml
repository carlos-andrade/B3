name: COTAHIST - atualização diária

permissions:
  contents: write

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: cotahist-atualizacao-diaria
  cancel-in-progress: false

jobs:
  atualizar-ano-corrente:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar COTAHIST do ano corrente
        shell: bash
        run: |
          set -euo pipefail
          year="$(date -u +%Y)"
          url="https://bvmf.bmfbovespa.com.br/InstDados/SerHist/COTAHIST_A${year}.ZIP"
          mkdir -p dados/cotahist/raw/anual dados/cotahist/manifests dados/cotahist/checksums
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 10             --connect-timeout 30 --max-time 600             "$url" -o "dados/cotahist/raw/anual/COTAHIST_A${year}.ZIP"
          test -s "dados/cotahist/raw/anual/COTAHIST_A${year}.ZIP"
          echo "ANO=$year" >> "$GITHUB_ENV"

      - name: Validar ZIP e layout B3
        shell: bash
        run: |
          set -euo pipefail
          year="$ANO"
          zip="dados/cotahist/raw/anual/COTAHIST_A${year}.ZIP"
          zipinfo -1 "$zip"
          rm -rf "/tmp/cotahist${year}"
          mkdir -p "/tmp/cotahist${year}"
          unzip -oq "$zip" -d "/tmp/cotahist${year}"
          files="$(find "/tmp/cotahist${year}" -type f | wc -l)"
          test "$files" -eq 1
          cotahist_file="$(find "/tmp/cotahist${year}" -type f | head -1)"
          python - "$cotahist_file" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          lines = p.read_bytes().splitlines()
          if not lines:
              raise SystemExit("arquivo COTAHIST vazio")
          if {len(x) for x in lines} != {245}:
              raise SystemExit("tamanhos de registro inesperados")
          if not lines[0].startswith(b"00"):
              raise SystemExit("header 00 ausente")
          if not lines[-1].startswith(b"99"):
              raise SystemExit("trailer 99 ausente")
          counts = {}
          for line in lines:
              key = line[:2].decode("ascii", "replace")
              counts[key] = counts.get(key, 0) + 1
          quotes = counts.get("01", 0)
          if quotes == 0:
              raise SystemExit("nenhum registro 01 encontrado")
          print(f"VALIDADO: {p.name}; REGISTROS={len(lines)}; COTACOES_01={quotes}; TIPOS={counts}")
          PY

      - name: Gerar SHA-256 e manifesto
        shell: bash
        run: |
          set -euo pipefail
          year="$ANO"
          zip="dados/cotahist/raw/anual/COTAHIST_A${year}.ZIP"
          checksum_file="dados/cotahist/checksums/COTAHIST_A${year}.ZIP.sha256"
          manifest_file="dados/cotahist/manifests/COTAHIST_A${year}.json"
          sha256sum "$zip" | tee "$checksum_file"
          python - "$year" "$zip" "$manifest_file" <<'PY'
          import datetime, hashlib, json, sys
          from pathlib import Path
          year = int(sys.argv[1])
          zip_path = Path(sys.argv[2])
          manifest_path = Path(sys.argv[3])
          digest = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          manifest = {
              "ano": year,
              "fonte": "B3",
              "arquivo_original": zip_path.name,
              "url": f"https://bvmf.bmfbovespa.com.br/InstDados/SerHist/COTAHIST_A{year}.ZIP",
              "sha256": digest,
              "status": "VALIDADO",
              "validacao": "ZIP com 1 arquivo COTAHIST; registros de 245 bytes; header 00; cotacoes 01; trailer 99",
              "acquired_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

      - name: Persistir somente se houver alteração
        shell: bash
        run: |
          set -euo pipefail
          year="$ANO"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             "dados/cotahist/raw/anual/COTAHIST_A${year}.ZIP"             "dados/cotahist/checksums/COTAHIST_A${year}.ZIP.sha256"             "dados/cotahist/manifests/COTAHIST_A${year}.json"
          if git diff --cached --quiet; then
            echo "SEM ALTERACAO: a versão diária já está igual à registrada."
            exit 0
          fi
          git commit -m "data(ingestao): atualizar COTAHIST ${year}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publicar evidência da execução
        uses: actions/upload-artifact@v4
        with:
          name: cotahist-diario-${{ env.ANO }}
          path: |
            dados/cotahist/raw/anual/COTAHIST_A${{ env.ANO }}.ZIP
            dados/cotahist/checksums/COTAHIST_A${{ env.ANO }}.ZIP.sha256
            dados/cotahist/manifests/COTAHIST_A${{ env.ANO }}.json
          if-no-files-found: error
          retention-days: 90
