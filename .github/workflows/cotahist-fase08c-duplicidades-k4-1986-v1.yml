name: COTAHIST FASE 08C - Duplicidades K4 1986
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/ingestao/analisar_duplicidades_k4_cotahist_1986_v1.py
      - dados/cotahist/raw/anual/COTAHIST_A1986.ZIP
      - .github/workflows/cotahist-fase08c-duplicidades-k4-1986-v1.yml
permissions:
  contents: write
jobs:
  analisar-duplicidades:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Executar analise estrutural
        run: python scripts/ingestao/analisar_duplicidades_k4_cotahist_1986_v1.py
      - name: Publicar evidencia
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_1986_FASE08C_DUPLICIDADES_K4_V1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(cotahist): publicar fase 08C duplicidades K4 1986"
          git pull --rebase origin main
          git push
