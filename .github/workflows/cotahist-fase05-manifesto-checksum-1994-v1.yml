name: COTAHIST - auditoria retrospectiva 1994 FASE05 V1

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cotahist-fase05-manifesto-checksum-1994-v1.yml"
      - "dados/cotahist/raw/anual/COTAHIST_A1994.ZIP"
      - "dados/cotahist/manifests/COTAHIST_A1994.json"
      - "dados/cotahist/checksums/COTAHIST_A1994.ZIP.sha256"
      - "dados/cotahist/quality/COTAHIST_1994_FASE04_NORMALIZACAO_V1.json"
      - "dados/cotahist/normalized/manifests/COTAHIST_A1994_quality.json"

permissions:
  contents: write

jobs:
  manifesto_checksum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Validar manifesto e checksum
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,sys,datetime,re
          root=pathlib.Path(".")
          raw=root/"dados/cotahist/raw/anual/COTAHIST_A1994.ZIP"
          man=root/"dados/cotahist/manifests/COTAHIST_A1994.json"
          chk=root/"dados/cotahist/checksums/COTAHIST_A1994.ZIP.sha256"
          f4=root/"dados/cotahist/quality/COTAHIST_1994_FASE04_NORMALIZACAO_V1.json"
          nm=root/"dados/cotahist/normalized/manifests/COTAHIST_A1994_quality.json"
          ev=root/"dados/cotahist/quality/COTAHIST_1994_FASE05_MANIFESTO_CHECKSUM_V1.json"
          for p in (raw,man,chk,f4,nm):
              if not p.exists(): sys.exit(f"FASE05 BLOQUEADA: ausente {p}")
          e4=json.loads(f4.read_text()); m=json.loads(man.read_text()); n=json.loads(nm.read_text())
          if e4.get("status")!="VALIDADO" or e4.get("decision")!="LIBERADO_PARA_FASE05": sys.exit("FASE05 BLOQUEADA: FASE04 não liberou")
          if m.get("status")!="VALIDADO" or m.get("ano")!=1994: sys.exit("FASE05 BLOQUEADA: manifesto principal inválido")
          if n.get("status")!="VALIDADO" or n.get("ano")!=1994: sys.exit("FASE05 BLOQUEADA: manifesto normalizado inválido")
          actual=hashlib.sha256(raw.read_bytes()).hexdigest()
          text=chk.read_text().strip()
          if actual!=m.get("sha256"): sys.exit("FASE05 BLOQUEADA: RAW diverge do manifesto")
          if actual!=text.split()[0]: sys.exit("FASE05 BLOQUEADA: RAW diverge do checksum")
          if not re.fullmatch(r"[0-9a-f]{64}",actual): sys.exit("FASE05 BLOQUEADA: SHA inválido")
          out={
            "schema_version":"1.0.0","year":1994,"phase":"FASE05","status":"VALIDADO",
            "decision":"LIBERADO_PARA_FASE06",
            "rule":"docs/cotahist/REGRA_GERAL_EXISTENCIA_E_VALIDACAO_V1.md",
            "raw_path":str(raw),"raw_sha256":actual,
            "manifest_path":str(man),"checksum_path":str(chk),
            "normalized_manifest_path":str(nm),
            "manifest_sha256_matches_raw":True,"checksum_matches_raw":True,
            "normalized_manifest_status":"VALIDADO","fase04_status":"VALIDADO",
            "validated_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          ev.parent.mkdir(parents=True,exist_ok=True); ev.write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Publicar evidência FASE05
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/quality/COTAHIST_1994_FASE05_MANIFESTO_CHECKSUM_V1.json
          git diff --cached --quiet && exit 0
          git commit -m "audit(cotahist): valida 1994 fase 05 manifesto checksum"
          git pull --rebase origin main
          git push origin HEAD:main
