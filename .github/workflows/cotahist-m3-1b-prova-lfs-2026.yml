# ID: B3-COTAHIST-M3-1B-LFS-READONLY-V2
# Estado: auditoria de armazenamento; não promove nem altera dados canónicos.
name: COTAHIST - M3-1B prova física Git LFS NORMALIZED 2026

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cotahist-m3-1b-prova-lfs-2026.yml"

permissions:
  contents: read

concurrency:
  group: cotahist-m3-1b-lfs-audit-2026
  cancel-in-progress: false

jobs:
  prova-lfs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout read-only com LFS
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: true
          persist-credentials: false

      - name: Validar armazenamento físico sem publicar
        shell: bash
        run: |
          set -euo pipefail
          FILE="dados/cotahist/normalized/anual/COTAHIST_A2026.csv"
          test -s "$FILE"
          test "$(git check-attr filter -- "$FILE" | awk '{print $3}')" = "lfs"
          ! grep -q "https://git-lfs.github.com/spec/v1" "$FILE"
          git lfs ls-files --long | grep -F "$FILE"
          sha256sum "$FILE" | tee "$RUNNER_TEMP/COTAHIST_A2026_LFS.sha256"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p = Path("dados/cotahist/normalized/anual/COTAHIST_A2026.csv")
          result = {
              "schema_version": "1.0.0",
              "artifact": str(p),
              "storage": "git-lfs",
              "lfs_filter": True,
              "physical_object_materialized": True,
              "bytes": p.stat().st_size,
              "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
              "scope": "prova de armazenamento apenas; não autoriza fonte, valida conteúdo nem promove o ano 2026",
          }
          out = Path(os.environ["RUNNER_TEMP"]) / "COTAHIST_A2026_LFS_PROOF.json"
          out.write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result, ensure_ascii=False))
          PY

      - name: Publicar artefactos de diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: cotahist-m3-1b-lfs-readonly-proof
          path: |
            ${{ runner.temp }}/COTAHIST_A2026_LFS_PROOF.json
            ${{ runner.temp }}/COTAHIST_A2026_LFS.sha256
          retention-days: 30
