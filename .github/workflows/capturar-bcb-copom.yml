name: Capturar BCB - Copom

on:
  push:
    paths:
      - ".github/workflows/capturar-bcb-copom.yml"
      - "scripts/ingestao/capturar_bcb_copom_v2.py"
      - "scripts/ingestao/validar_bcb_copom_v1.py"
  workflow_dispatch:
    inputs:
      quantidade:
        description: "Quantidade de reuniões a consultar"
        required: true
        default: "5"
  schedule:
    - cron: "15 12 * * 2-5"

permissions:
  contents: write

jobs:
  copom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capturar API BCB
        run: |
          set -euo pipefail
          python scripts/ingestao/capturar_bcb_copom_v2.py \
            --quantidade "${{ inputs.quantidade || '5' }}" \
            --output "dados/calendario_economico/copom"
      - name: Validar NORMALIZED
        run: |
          set -euo pipefail
          latest="$(find dados/calendario_economico/copom/normalized -name 'copom_*.json' -type f | sort | tail -1)"
          test -n "$latest"
          python scripts/ingestao/validar_bcb_copom_v1.py "$latest"
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "B3 Data Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ingestao/capturar_bcb_copom_v2.py dados/calendario_economico/copom
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nova."
          else
            git commit -m "data(bcb): captura Copom RAW e NORMALIZED"
            git push
          fi
