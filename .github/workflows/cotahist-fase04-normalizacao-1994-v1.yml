name: COTAHIST 1994 - materializar NORMALIZED V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dados/cotahist/raw/anual/COTAHIST_A1994.ZIP"
      - "scripts/ingestao/normalize_cotahist.py"
      - ".github/workflows/cotahist-fase04-normalizacao-1994-v1.yml"
      - "dados/cotahist/quality/COTAHIST_1994_FASE04_EXEC_TRIGGER.txt"

permissions:
  contents: write

concurrency:
  group: cotahist-materializar-normalized-1994-v2
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout com LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar pré-condições FASE03
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("dados/cotahist/quality/COTAHIST_1994_FASE03_PARSING_V1.json")
          e=json.loads(p.read_text())
          if e.get("status")!="VALIDADO" or e.get("decision")!="LIBERADO_PARA_FASE04":
              raise SystemExit("FAIL-CLOSED: FASE03 não liberou FASE04")
          print("FASE03=VALIDADO; DECISAO=LIBERADO_PARA_FASE04")
          PY

      - name: Normalizar 1994
        run: |
          python scripts/ingestao/normalize_cotahist.py \
            --zip dados/cotahist/raw/anual/COTAHIST_A1994.ZIP \
            --output dados/cotahist/normalized/anual/COTAHIST_A1994.csv

      - name: Verificar identidade contra manifesto
        run: |
          python - <<'PY'
          import hashlib, json, csv
          from pathlib import Path
          root=Path(".")
          p=root/"dados/cotahist/normalized/anual/COTAHIST_A1994.csv"
          m=json.loads((root/"dados/cotahist/normalized/manifests/COTAHIST_A1994_quality.json").read_text())
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          print("NORMALIZED_SHA256_ACTUAL="+h)
          print("NORMALIZED_SHA256_MANIFEST="+str(m.get("normalized_sha256")))
          if h != m.get("normalized_sha256"):
              raise SystemExit("FAIL-CLOSED: hash normalizado difere do manifesto")
          with p.open(encoding="utf-8",newline="") as fh:
              r=csv.reader(fh)
              header=next(r)
              rows=list(r)
          if len(header)!=25:
              raise SystemExit(f"FAIL-CLOSED: campos={len(header)}; esperado=25")
          if len(rows)!=119097:
              raise SystemExit(f"FAIL-CLOSED: linhas={len(rows)}; esperado=119097")
          dates=[x[0] for x in rows]
          if min(dates)!="1994-01-03" or max(dates)!="1994-12-29":
              raise SystemExit("FAIL-CLOSED: intervalo de datas divergente")
          print("ROWS=119097; FIELDS=25; FIRST=1994-01-03; LAST=1994-12-29")
          PY

      - name: Gerar evidência FASE04
        run: |
          python - <<'PY'
          import datetime, hashlib, json
          from pathlib import Path
          root=Path(".")
          raw=root/"dados/cotahist/raw/anual/COTAHIST_A1994.ZIP"
          norm=root/"dados/cotahist/normalized/anual/COTAHIST_A1994.csv"
          manifest=root/"dados/cotahist/normalized/manifests/COTAHIST_A1994_quality.json"
          ev=root/"dados/cotahist/quality/COTAHIST_1994_FASE04_NORMALIZACAO_V1.json"
          m=json.loads(manifest.read_text())
          out={
            "schema_version":"1.0.0",
            "year":1994,
            "phase":"FASE04",
            "status":"VALIDADO",
            "decision":"LIBERADO_PARA_FASE05",
            "rule":"docs/cotahist/REGRA_GERAL_EXISTENCIA_E_VALIDACAO_V1.md",
            "validation_method":"normalizacao_deterministica_com_script_canonico_e_publicacao_Git_LFS",
            "raw_path":str(raw),
            "raw_sha256":hashlib.sha256(raw.read_bytes()).hexdigest(),
            "normalized_path":str(norm),
            "normalized_manifest_path":str(manifest),
            "normalized_sha256":hashlib.sha256(norm.read_bytes()).hexdigest(),
            "parser_version":m.get("parser_version"),
            "rows":119097,
            "fields":25,
            "invalid_dates":0,
            "first_date":"1994-01-03",
            "last_date":"1994-12-29",
            "manifest_matches_computed":True,
            "raw_matches_manifest":True,
            "normalization_is_deterministically_reconciled":True,
            "validated_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          ev.write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          PY

      - name: Commitar NORMALIZED e evidência
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotahist/normalized/anual/COTAHIST_A1994.csv dados/cotahist/quality/COTAHIST_1994_FASE04_NORMALIZACAO_V1.json
          git diff --cached --quiet && exit 0
          git commit -m "data(cotahist): materializa normalized de 1994"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
