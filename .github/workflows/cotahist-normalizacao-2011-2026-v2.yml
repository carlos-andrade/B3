name: COTAHIST - normalizacao historica 2011-2026 V2

# V2 legada: somente execucao manual.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar arquivos RAW 2011-2026
        shell: bash
        run: |
          set -euo pipefail
          for year in 2011 2012 2013 2014 2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025 2026; do
            test -s "dados/cotahist/raw/anual/COTAHIST_A${year}.ZIP"
          done
          echo "RAW_COTAHIST_2011_2026_PRESENTE"
