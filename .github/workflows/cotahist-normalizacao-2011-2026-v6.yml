name: COTAHIST - normalizacao historica 2011-2026 V6

# V6 mantida apenas para execucao manual.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalizar anos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/normalized
          for year in 2011 2012 2013 2014 2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025 2026; do
            zip="dados/cotahist/raw/anual/COTAHIST_A${year}.ZIP"
            csv="/tmp/normalized/COTAHIST_A${year}.csv"
            test -s "$zip"
            python scripts/ingestao/normalize_cotahist.py --zip "$zip" --output "$csv"
          done
      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: cotahist-normalized-2011-2026-v6
          path: /tmp/normalized/*.csv
          retention-days: 7
          if-no-files-found: error
